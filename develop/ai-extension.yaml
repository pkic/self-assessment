      - number: 1
        name: Initial
        description: |
          - Risk assessment and BIA do not consider AI-system cryptographic scenarios
          - Incident planning omits AI-layer cryptographic events
          - Business continuity does not address AI identity or signing services
          - No future-proofing for AI-layer cryptography
      - number: 2
        name: Foundational
        description: |
          - General awareness of AI cryptographic risk
          - AI cryptographic scenarios not yet in the risk register
          - Continuity for AI services not planned
          - AI-layer future-proofing not identified
      - number: 3
        name: Advanced
        description: |
          - AI-system cryptographic scenarios included in risk assessment and BIA (signing-key compromise, agent identity outage, tampered model)
          - Incident planning covers AI-layer cryptographic events
          - Business continuity addresses AI identity and signing services
          - Technology future-proofing carries the AI layer onto a quantum-safe path in step with the PKI
      - number: 4
        name: Managed
        description: |
          - AI cryptographic risk reviewed quarterly and integrated with enterprise risk
          - Continuity for AI identity and signing services is tested
          - Competence and information sharing established across security, ML, and compliance
      - number: 5
        name: Optimized
        description: |
          - AI cryptographic resilience is anticipated, with scenario planning across the AI trust chain
          - Continual improvement driven by AI-layer incidents and near-misses
          - Resilience practice for AI systems informs standards and peers
    - id: automation
      weight: 4
      guidance: |
        The AI system layer cannot be governed manually. Agent populations are large and short-lived, so credential issuance, renewal, and revocation must be automated; model provenance verification should be an automated gate in the deployment pipeline; and cryptographic inventory of AI systems should be discovered automatically. Automation descriptions should document these flows, monitoring and auditing should cover the automated AI-trust processes themselves, and exception handling should define what happens when automation fails (for example an issuance backlog, or a provenance check that cannot complete).
        Automation is also what makes the EU AI Act Article 12 expectation of automatically generated, tamper-evident logs practical at AI-system scale, and what keeps cascade revocation timely.
        Persona split: providers automate signing and attestation generation in the build pipeline; deployers automate signature and attestation verification as a deployment gate. Agent credential automation applies to both roles.
      assessment: |
        Key Probes:
          - Are agent credential issuance, renewal, and revocation automated?
          - Is model provenance verification an automated deployment gate?
          - Is cryptographic inventory of AI systems discovered automatically?
          - Is the automation of AI-trust processes itself monitored and audited, with defined exception handling?

        Warning Signs:
          - Manual agent credential handling at scale
          - Model provenance checked manually or not at all
          - Automated AI-trust processes run unmonitored
          - No exception handling when AI-trust automation fails

        Evidence Examples by Level:
          - Level 2: Some scripted AI-trust tasks; largely manual
          - Level 3: Documented automation for agent credential lifecycle and provenance gating; monitoring of automated processes; exception handling defined
          - Level 4: Automation covers issuance, renewal, revocation, and provenance at scale; audited; exceptions handled and reviewed
          - Level 5: Fully automated, self-healing AI-trust operations with comprehensive monitoring
      references:
      - nist-sp-800-92
      - slsa
      levels:
      - number: 1
        name: Initial
        description: |
          - AI-trust processes are manual
          - Agent credential lifecycle is handled by hand
          - Model provenance is not verified automatically
          - No monitoring or exception handling for AI-trust automation
      - number: 2
        name: Foundational
        description: |
          - Some AI-trust tasks scripted, but largely manual
          - Awareness that agent scale requires automation
          - Provenance gating not yet automated
          - Exception handling for automation undefined
      - number: 3
        name: Advanced
        description: |
          - Agent credential issuance, renewal, and revocation are automated
          - Model provenance verification is an automated deployment gate
          - Provider: model signing and attestation generation are automated in the build pipeline
          - Cryptographic inventory of AI systems is discovered automatically
          - Automated AI-trust processes are monitored, with defined exception handling
      - number: 4
        name: Managed
        description: |
          - Automation covers the agent credential lifecycle and provenance gating at population scale
          - Automated AI-trust processes are audited
          - Exceptions are handled and reviewed for improvement
      - number: 5
        name: Optimized
        description: |
          - AI-trust operations are fully automated and self-healing
          - Monitoring of automated processes is comprehensive
          - Automation practice for AI systems informs standards and peers
    - id: interoperability
      weight: 3
      guidance: |
        AI system trust increasingly crosses boundaries: agents from different teams or organizations interact, workloads federate identity, and AI-generated content moves between systems that need to verify its provenance. Adopting open standards is what makes this tractable — SPIFFE for workload identity, RFC 8693 token exchange for delegated authority, C2PA for content provenance, and SLSA / in-toto for model supply-chain attestations. An interoperability strategy should state which standards the organization adopts for AI trust, and integration guidance should help internal and external parties consume AI-system identities and verify provenance.
        Betting on proprietary AI-identity or provenance mechanisms creates lock-in and blocks cross-domain trust; open standards keep the AI trust layer composable with partners and with the wider ecosystem.
        Persona split: providers emit attestations and provenance in open formats so any relying party can verify them; deployers implement verification of those formats and require them from vendors.
      assessment: |
        Key Probes:
          - Does the interoperability strategy cover AI system identity and provenance?
          - Are open standards adopted for workload identity, delegation, and content/model provenance (SPIFFE, RFC 8693, C2PA, SLSA/in-toto)?
          - Is integration guidance available for consuming AI-system identities and verifying provenance?
          - Is cross-domain AI trust (multi-team, multi-organization) tested?

        Warning Signs:
          - Proprietary agent-identity or provenance mechanisms with no standards basis
          - No strategy for cross-domain AI trust
          - Integration guidance for AI identity/provenance absent
          - Provenance that cannot be verified outside the issuing system

        Evidence Examples by Level:
          - Level 2: Awareness of AI-trust standards; informal adoption
          - Level 3: Interoperability strategy covers AI identity/provenance; open standards adopted; integration guidance documented
          - Level 4: Cross-domain AI trust tested; standards adoption verified in integrations
          - Level 5: Seamless federated AI trust across domains; contribution to AI identity/provenance standards
      references:
      - open-standards-principles
      - spiffe
      - c2pa
      - in-toto
      levels:
      - number: 1
        name: Initial
        description: |
          - No interoperability strategy for AI system identity or provenance
          - No open standards adopted for the AI trust layer
          - No integration guidance for AI identities or provenance
          - AI provenance cannot be verified outside the issuing system
      - number: 2
        name: Foundational
        description: |
          - Awareness of open standards for AI trust
          - Informal or partial adoption
          - Interoperability strategy does not yet cover the AI layer
          - Integration guidance not documented
      - number: 3
        name: Advanced
        description: |
          - Interoperability strategy covers AI system identity and provenance
          - Open standards adopted (SPIFFE for workload identity, RFC 8693 for delegation, C2PA for content provenance, SLSA/in-toto for model attestations)
          - Integration guidance documented for consuming AI identities and verifying provenance
          - Provider: attestations and provenance emitted in open formats (for example SLSA provenance, in-toto layouts, C2PA manifests)
          - Deployer: verification of standard attestations implemented and required from vendors
      - number: 4
        name: Managed
        description: |
          - Cross-domain AI trust (multi-team, multi-organization) is tested
          - Standards adoption is verified in real integrations
          - Interoperability for the AI layer is reviewed and maintained
      - number: 5
        name: Optimized
        description: |
          - Federated AI trust operates seamlessly across domains
          - Provenance is verifiable across the ecosystem
          - Organization contributes to AI identity and provenance standards
    - id: monitoring-and-auditing
      weight: 5
      guidance: |
        This category carries the EU AI Act Article 12 obligation into the base model: high-risk AI systems must automatically generate tamper-evident logs that enable traceability. For AI system cryptographic governance this means logging requirements must define the cryptographic events to capture — which agent acted, under whose delegated authority, against which model version, with which credential — and those logs must support reconstruction of an audit trail that answers, verifiably, what an AI system did and on whose authority. Event monitoring should detect AI credential anomalies (unexpected agent behavior, credential misuse), and critical events (agent credential compromise, detection of a tampered or unsigned model) should be alerted and resolved under the incident plan.
        Because the agent action layer — tool and API calls — is treated as in scope for the AI Act, the audit trail should extend to action-layer authorization events, not just model outputs. Tamper-evidence of the logs themselves is part of the requirement, so log integrity protection belongs here.
        Persona note: record-keeping duties fall on both roles — providers keep the automatically generated logs of the systems they place on the market (Article 19), and deployers retain the logs under their control for at least six months (Article 26(6)). The audit-trail criteria apply to whichever role's logs the organization holds.
      assessment: |
        Key Probes:
          - Do logging requirements define AI-system cryptographic events (agent identity, delegated authority, model version, credential used, action-layer authorization)?
          - Are AI-system logs collected and tamper-evident, consistent with EU AI Act Article 12?
          - Can an audit trail reconstruct, verifiably, what an AI system did and on whose authority?
          - Is monitoring in place for AI credential anomalies, with alerting on compromise or model tampering?

        Warning Signs:
          - AI-system actions not logged, or logs not tamper-evident
          - Audit trail cannot attribute an action to a specific agent and authority
          - Action-layer (tool/API) calls not captured
          - No alerting on AI credential compromise or tampered models

        Evidence Examples by Level:
          - Level 2: Some AI-system logging; not tamper-evident; attribution incomplete
          - Level 3: Defined AI cryptographic logging requirements; tamper-evident collection; reconstructable audit trail; monitoring and alerting for AI credential events
          - Level 4: Audit trail attributes actions to agent and authority across the action layer; anomaly detection tuned; critical events alerted and resolved
          - Level 5: Comprehensive, verifiable AI-system audit trail; proactive anomaly detection; log integrity continuously assured
      references:
      - eu-ai-act
      - nist-sp-800-92
      - nist-sp-800-61
      levels:
      - number: 1
        name: Initial
        description: |
          - AI-system cryptographic events are not logged
          - No tamper-evidence for any AI-system logs that do exist
          - Audit trail cannot attribute actions to a specific agent or authority
          - No monitoring or alerting for AI credential events
      - number: 2
        name: Foundational
        description: |
          - Some AI-system logging exists but is incomplete and not tamper-evident
          - Attribution of actions to agent and authority is partial
          - Action-layer (tool/API) calls are not consistently captured
          - Alerting for AI credential compromise or model tampering is absent
      - number: 3
        name: Advanced
        description: |
          - Logging requirements define AI-system cryptographic events (agent identity, delegated authority, model version, credential, action-layer authorization)
          - AI-system logs are collected and tamper-evident, consistent with EU AI Act Article 12
          - Audit trail can reconstruct what an AI system did and on whose authority
          - Monitoring detects AI credential anomalies; critical events are alerted and resolved under the incident plan
      - number: 4
        name: Managed
        description: |
          - Audit trail attributes actions to agent and authority across the action layer
          - Anomaly detection for AI credentials is tuned and effective
          - Critical AI cryptographic events are consistently alerted and resolved
          - Log review for the AI layer is performed periodically
      - number: 5
        name: Optimized
        description: |
          - AI-system audit trail is comprehensive and verifiable end to end
          - Anomaly detection is proactive across the agent population and action layer
          - Log integrity is continuously assured
          - Monitoring and audit practice for AI systems informs standards and peers
  - id: R
    categories:
    - id: sourcing
      weight: 3
      guidance: |
        Governing the AI system layer requires the right resources: people who understand AI identity and provenance, and tooling and vendors that support it. Resource identification should capture what the AI trust layer needs — model registries that support signing, agent platforms that support workload identity and revocation, key stores/HSMs for signing keys — and vendor assessment should test whether candidate AI platforms can meet the organization's identity, integrity, provenance, and logging requirements rather than assuming they can. Availability of AI identity and signing capability should be treated as a dependency the organization must secure, and resources should be reviewed as the AI estate grows.
        As with the PKI layer, an organization can reach strong internal governance yet be blocked by a critical AI platform that cannot sign models, issue workload identities, or emit the tamper-evident logs the AI Act expects.
        Persona split: for deployers, vendor capability assessment is the central sourcing control — procured AI platforms and models must demonstrably support signing, attestations, workload identity, and Article 12 logging. Providers additionally source the signing infrastructure itself — HSMs, signing services, and registries that preserve attestations.
      assessment: |
        Key Probes:
          - Are the resources needed for AI trust (people, tooling, vendors) identified and documented?
          - Does vendor assessment test AI platforms for identity, integrity, provenance, and logging capability?
          - Is availability of AI identity and signing capability secured as a dependency?
          - Are AI-trust resources reviewed as the estate grows?

        Warning Signs:
          - AI platforms procured without checking identity/provenance/logging capability
          - No named resources for AI trust
          - Signing or workload-identity capability assumed but unavailable
          - AI-trust resourcing not revisited as the estate grows

        Evidence Examples by Level:
          - Level 2: Informal awareness of AI-trust resource needs
          - Level 3: Documented AI-trust resource needs; vendor assessment covering AI trust capabilities; availability treated as a dependency
          - Level 4: AI-trust resources reviewed regularly; vendor capability verified in practice
          - Level 5: AI-trust resourcing anticipates estate growth; vendor roadmaps steered toward required capabilities
      references:
      - iso-27001
      - nist-ai-rmf
      levels:
      - number: 1
        name: Initial
        description: |
          - Resources needed for AI trust are not identified
          - Vendor assessment does not consider AI identity, provenance, or logging
          - Availability of AI signing/identity capability is not treated as a dependency
          - AI-trust resourcing is not reviewed
      - number: 2
        name: Foundational
        description: |
          - Awareness that AI trust needs specific resources and capable vendors
          - Resource needs not yet documented
          - Vendor assessment for AI trust capability is informal
          - Availability of AI capability is assumed
      - number: 3
        name: Advanced
        description: |
          - AI-trust resource needs (people, tooling, vendors) are documented
          - Vendor assessment tests AI platforms for identity, integrity, provenance, and logging capability
          - Availability of AI identity and signing capability is secured as a dependency
          - AI-trust resources are reviewed as the estate changes
      - number: 4
        name: Managed
        description: |
          - AI-trust resources are reviewed regularly against demand
          - Vendor capability for AI trust is verified in practice, not assumed
          - Resource gaps for the AI layer are tracked and closed
      - number: 5
        name: Optimized
        description: |
          - AI-trust resourcing anticipates estate growth and new AI trust patterns
          - Vendor roadmaps are steered toward the identity, provenance, and logging capabilities required
          - Sourcing practice for AI trust informs peers
    - id: knowledge-and-training
      weight: 3
      guidance: |
        AI system cryptographic governance spans disciplines that rarely sit together: PKI and cryptography, machine learning and model operations, and AI regulation. Training plans should build competence in AI identity, model signing and provenance, and the cryptographic obligations of the EU AI Act and DORA, for the specific roles that operate the AI trust layer. Responsible personnel — AI identity operators, model-signing authorities, ML engineers deploying signed models — should receive role-appropriate training, and security-awareness content should reflect AI-trust concerns. Knowledge should be reviewed as standards and regulation evolve.
        Without this, the AI trust layer is operated by people fluent in one domain but not the others, which is a common root cause of ungoverned AI cryptography even where tooling exists.
      assessment: |
        Key Probes:
          - Does the training plan cover AI identity, model signing/provenance, and AI-layer regulatory obligations?
          - Do the roles operating the AI trust layer receive role-appropriate training?
          - Does security-awareness content reflect AI-trust concerns?
          - Is AI-trust knowledge reviewed as standards and regulation change?

        Warning Signs:
          - AI trust operated by staff trained in only one of PKI, ML, or AI regulation
          - No role-specific training for AI identity operators or model-signing authorities
          - Awareness content silent on AI-trust risks
          - Knowledge not refreshed as the field moves

        Evidence Examples by Level:
          - Level 2: Ad hoc knowledge; no AI-trust training plan
          - Level 3: Training plan covering AI identity, signing/provenance, and regulation; role-appropriate training delivered
          - Level 4: Training effectiveness tracked; knowledge reviewed periodically
          - Level 5: AI-trust competence sustained and deepened; knowledge shared internally and externally
      references:
      - nist-sp-800-16
      - nist-sp-800-50
      - ecsf
      levels:
      - number: 1
        name: Initial
        description: |
          - No training plan for AI system cryptographic governance
          - Roles operating the AI trust layer receive no relevant training
          - Security-awareness content does not address AI trust
          - AI-trust knowledge is not reviewed
      - number: 2
        name: Foundational
        description: |
          - Awareness that AI trust requires cross-disciplinary competence
          - Training is ad hoc, with no plan
          - Role-specific AI-trust training is not established
          - Awareness content does not yet reflect AI-trust concerns
      - number: 3
        name: Advanced
        description: |
          - Training plan covers AI identity, model signing and provenance, and the cryptographic obligations of the EU AI Act and DORA
          - Responsible personnel receive role-appropriate AI-trust training
          - Security-awareness content reflects AI-trust concerns
          - AI-trust knowledge is reviewed as standards and regulation evolve
      - number: 4
        name: Managed
        description: |
          - Training effectiveness for AI trust is tracked
          - Knowledge is reviewed periodically and kept current
          - Cross-disciplinary competence (PKI, ML, regulation) is deliberately built
      - number: 5
        name: Optimized
        description: |
          - AI-trust competence is sustained, deepened, and refreshed continuously
          - Knowledge is shared internally and with the wider community
          - Training practice for AI trust informs peers and programs
    - id: awareness
      weight: 3
      guidance: |
        Beyond the specialists who operate it, the wider organization should be aware that AI systems are cryptographic actors and that using an unsigned model or an unidentified agent carries risk. An awareness plan should communicate, to developers and stakeholders who build with or deploy AI, what the organization's AI-trust posture requires — that models must be signed and their provenance verified, that agents must hold managed identities, and that AI-system actions are logged. Where relevant, the organization should be able to disclose its AI-trust posture to relying parties, and there should be a clear point of contact for AI-trust and AI-identity questions, with timely communication when posture or requirements change.
        Awareness closes the gap between policy and behavior: developers who understand why model signing and agent identity matter are far more likely to build within the AI-trust controls rather than around them.
      assessment: |
        Key Probes:
          - Does an awareness plan communicate AI-trust requirements to developers and stakeholders?
          - Can the organization disclose its AI-trust posture to relying parties where relevant?
          - Is there a clear point of contact for AI-trust and AI-identity questions?
          - Are changes to AI-trust posture or requirements communicated in a timely way?

        Warning Signs:
          - Developers unaware that models must be signed or agents must hold managed identities
          - No disclosure of AI-trust posture to relying parties
          - No point of contact for AI-trust questions
          - Changes to AI-trust requirements not communicated

        Evidence Examples by Level:
          - Level 2: Informal awareness among some teams
          - Level 3: AI-trust awareness plan; disclosure of posture where relevant; named point of contact
          - Level 4: Awareness measured; timely communication of changes established
          - Level 5: Strong organization-wide AI-trust culture; proactive communication and disclosure
      references:
      - enisa-cyber-awareness
      - nist-sp-800-50
      levels:
      - number: 1
        name: Initial
        description: |
          - No awareness that AI systems are cryptographic actors
          - AI-trust requirements are not communicated to developers or stakeholders
          - No disclosure of AI-trust posture and no point of contact
          - Changes to AI-trust requirements are not communicated
      - number: 2
        name: Foundational
        description: |
          - Informal awareness of AI-trust concerns among some teams
          - No structured awareness plan
          - Disclosure of posture is not established
          - Point of contact for AI-trust questions is unclear
      - number: 3
        name: Advanced
        description: |
          - Awareness plan communicates AI-trust requirements to developers and stakeholders
          - AI-trust posture can be disclosed to relying parties where relevant
          - A clear point of contact exists for AI-trust and AI-identity questions
          - Changes to AI-trust posture and requirements are communicated in a timely way
      - number: 4
        name: Managed
        description: |
          - Awareness of AI-trust requirements is measured across the organization
          - Timely communication of AI-trust changes is established and reliable
          - Awareness activities are reviewed and improved
      - number: 5
        name: Optimized
        description: |
          - A strong, organization-wide AI-trust culture is embedded
          - Communication and disclosure of AI-trust posture are proactive
          - Awareness practice for AI trust informs peers
overlays:
  modules:
  - id: G
    categories:
    - id: strategy-and-vision
      requirements:
      - id: scope-and-drivers
        type: multiplier
        multiplier: 2.0
        rationale: |
          AI systems as cryptographic actors, and the EU AI Act / DORA obligations that attach to them, are new business drivers absent from classical PKI scope. The AI layer must be explicitly in scope for the driver analysis, not assumed to be covered by PKI scope.
      - id: architecture
        type: multiplier
        multiplier: 2.0
        rationale: |
          Base weight 1 (floor), yet the trust architecture for AI systems — agent identity model, model-signing topology, provenance chain, delegation design — is among the most consequential decisions for AI-layer governance. Large gap between base weight and AI-governance importance.
    - id: policies-and-documentation
      requirements:
      - id: certificate-policy
        type: multiplier
        multiplier: 1.5
        rationale: |
          The certificate/trust policy must be extended to cover agent credential profiles, owner/sponsor binding, delegation, and model-signing — new content the classical CP does not contain. Weight is already high, but the AI layer changes what the policy must define.
      - id: policy-review
        type: multiplier
        multiplier: 1.5
        rationale: |
          AI trust standards and regulation move quickly; policy review must cover the AI layer with a cadence that keeps agent profiles, provenance formats, and algorithm choices current.
    - id: compliance
      requirements:
      - id: compliance-policies
        type: multiplier
        multiplier: 2.0
        rationale: |
          The EU AI Act (Articles 12 and 15) and DORA-for-AI introduce a new compliance domain with cryptographic obligations distinct from PKI compliance. These are new obligations, not expanded existing ones.
      - id: compliance-monitoring
        type: multiplier
        multiplier: 1.5
        rationale: |
          Monitoring scope expands to AI-layer conformance (Article 12 log integrity, provenance, agent identity coverage), but the core activity remains operating a compliance monitoring program.
    - id: processes-and-procedures
      requirements:
      - id: process-documentation
        type: multiplier
        multiplier: 2.0
        rationale: |
          Agent onboarding/offboarding with cascade revocation, model-signing ceremonies, and provenance-verification gating are fundamentally new processes with no classical-PKI equivalent, not merely expanded documentation.
      - id: process-evidence
        type: multiplier
        multiplier: 1.5
        rationale: |
          New evidence categories arise for the AI layer: signing-ceremony records, cascade-revocation test results, provenance-verification logs. The evidence discipline is broader than for classical PKI operations.
    - id: cryptography
      requirements:
      - id: crypto-visibility
        type: multiplier
        multiplier: 2.0
        rationale: |
          The core gap the extension addresses. AI systems (models, agents, inference endpoints) must appear in the cryptographic inventory; without visibility into AI-layer cryptography, the AI systems remain ungoverned even with a mature PKI.
      - id: crypto-agility
        type: multiplier
        multiplier: 2.0
        rationale: |
          Crypto-agility must reach the AI trust chain (model-signing algorithm, agent credential algorithm, inference transport). This is the capability that lets the AI layer track deprecation and the PQC transition without re-architecting.
      - id: crypto-algorithms
        type: multiplier
        multiplier: 1.5
        rationale: |
          Approved-algorithm governance must extend to AI-specific uses (model signing, agent credentials, inference transport). Weight is already high, but coverage of AI uses is a substantive expansion.
      - id: crypto-lifecycle
        type: multiplier
        multiplier: 1.5
        rationale: |
          Lifecycle and deprecation rules must apply to cryptography embedded in model-provenance chains and long-lived signed artifacts, which have different longevity considerations from classical certificates.
  - id: M
    categories:
    - id: key-management
      requirements:
      - id: key-lifecycle
        type: multiplier
        multiplier: 1.5
        rationale: |
          Ephemeral, high-volume agent keys and high-value model-signing keys impose lifecycle demands (very short lifetimes on one end, strong dual-control hardware protection on the other) beyond classical key lifecycle.
      - id: key-inventory
        type: multiplier
        multiplier: 1.5
        rationale: |
          The key inventory must include AI-system keys (agent, model-signing, inference) and their backing stores, which are commonly omitted from classical key inventories.
    - id: certificate-management
      requirements:
      - id: cert-lifecycle
        type: multiplier
        multiplier: 2.0
        rationale: |
          Agent credential lifecycle is high-volume, short-lived, continuously issued and renewed, and must support cascade revocation — a materially different and more demanding lifecycle than classical certificate management.
      - id: cert-inventory
        type: multiplier
        multiplier: 1.5
        rationale: |
          An inventory of issued AI-system credentials is essential so that no agent acts on organizational authority unaccounted for; this extends the classical issued-certificate inventory to a fast-changing agent population.
      - id: cert-discovery
        type: multiplier
        multiplier: 1.5
        rationale: |
          Discovery must find agents and workloads holding identities across a dynamic estate; unknown agents holding credentials is a distinct AI-layer risk.
      - id: cert-profiles
        type: multiplier
        multiplier: 1.5
        rationale: |
          New credential profiles are required for AI systems (owner/sponsor binding, workload identity such as SPIFFE URI SAN), beyond classical certificate profiles.
    - id: infrastructure-management
      requirements:
      - id: vulnerability-management
        type: multiplier
        multiplier: 1.5
        rationale: |
          Vulnerability management must extend to AI-serving components (model registries, inference gateways, agent runtimes), whose compromise can expose signing keys or admit tampered models.
    - id: change-management-and-agility
      requirements:
      - id: agility-requirements
        type: multiplier
        multiplier: 2.0
        rationale: |
          Agility requirements must be identified explicitly for the AI trust chain (algorithms, credential profiles, revocation behavior, provenance formats) so AI-layer cryptographic change does not require re-architecting.
  - id: O
    categories:
    - id: resilience
      requirements:
      - id: risk-assessment
        type: multiplier
        multiplier: 1.5
        rationale: |
          Risk assessment and BIA must incorporate AI-system cryptographic scenarios (model-signing key compromise, agent identity outage, tampered model in production), which are new impact pathways.
      - id: future-proofing
        type: multiplier
        multiplier: 1.5
        rationale: |
          Technology future-proofing must carry the AI layer onto a quantum-safe path; confidential inference and long-lived signed provenance are exposed to harvest-now-decrypt-later, in step with the PKI.
    - id: automation
      requirements:
      - id: automation-description
        type: multiplier
        multiplier: 2.0
        rationale: |
          Large, short-lived agent populations make automation of credential issuance, renewal, revocation, and provenance gating a necessity rather than an option; the automated AI-trust flows must be described and governed.
    - id: interoperability
      requirements:
      - id: open-standards
        type: multiplier
        multiplier: 2.0
        rationale: |
          Cross-domain AI trust depends on open standards (SPIFFE, RFC 8693, C2PA, SLSA/in-toto). Proprietary AI-identity or provenance mechanisms block federation and verifiable provenance across the ecosystem.
    - id: monitoring-and-auditing
      requirements:
      - id: audit-trail
        type: multiplier
        multiplier: 2.0
        rationale: |
          EU AI Act Article 12 requires a reconstructable, tamper-evident record of what a high-risk AI system did; the audit trail must attribute actions to a specific agent and delegated authority across the action layer — a new and central AI-layer requirement.
      - id: logging-requirements
        type: multiplier
        multiplier: 1.5
        rationale: |
          Logging requirements must define AI-system cryptographic events (agent identity, delegated authority, model version, credential, action-layer authorization) and tamper-evidence, expanding classical logging scope.
      - id: event-monitoring
        type: multiplier
        multiplier: 1.5
        rationale: |
          Monitoring must detect AI credential anomalies and misuse across the agent population and action layer, a new detection surface beyond classical operational and security events.
  - id: R
    categories:
    - id: sourcing
      requirements:
      - id: resource-identification
        type: multiplier
        multiplier: 1.5
        rationale: |
          Resource identification must capture AI-trust needs (signing-capable model registries, workload-identity-capable agent platforms, HSMs for signing keys) and vendor capability, which classical sourcing does not consider.
    - id: knowledge-and-training
      requirements:
      - id: personnel-training
        type: multiplier
        multiplier: 1.5
        rationale: |
          Operating the AI trust layer requires cross-disciplinary competence (PKI, ML/model operations, AI regulation); role-appropriate training for AI identity operators and model-signing authorities is a new requirement.
    - id: awareness
      requirements:
      - id: awareness-plan
        type: multiplier
        multiplier: 1.5
        rationale: |
          Developers and stakeholders must understand that models require signing and provenance verification and that agents require managed identities; the awareness plan must carry these AI-trust requirements to close the policy-to-behavior gap.
