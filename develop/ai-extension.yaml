relevance:
  modules:
  - id: G
    categories:
    - id: strategy-and-vision
      weight: 4
      guidance: |
        AI systems are cryptographic actors. Models are signed artifacts with a provenance chain; autonomous agents hold identities and act on delegated organizational authority; inference endpoints are trust boundaries. Strategy must recognize that governing the underlying PKI does not, by itself, govern the AI systems built on top of it — an organization can hold strong PKI maturity while its models and agents remain unsigned, unidentified, and unaccountable.
        Executive sponsorship should frame AI system cryptographic governance as a first-class trust concern with its own budget and roadmap, aligned to the EU AI Act application timeline (high-risk obligations from August 2026) and, for financial entities, to DORA ICT risk management. The strategy positions AI identity, model integrity, and output provenance as enablers of trustworthy AI, not as a compliance afterthought bolted on at deployment.
      assessment: |
        Key Probes:
          - Can executives articulate that AI models and agents are cryptographic actors requiring identity, integrity, and provenance controls?
          - Does strategic planning distinguish the AI system layer from the PKI infrastructure layer, and assign ownership for the former?
          - Has the organization identified which AI systems are in scope for the EU AI Act (high-risk) and/or DORA?
          - Is budget allocated specifically for AI identity, model signing, and provenance infrastructure?
          - Is there executive recognition that ungoverned AI cryptography is a distinct risk from ungoverned PKI?

        Warning Signs:
          - 'Our PKI is mature, so our AI is covered' — conflates the infrastructure layer with the AI system layer
          - AI trust treated as a model-quality or safety problem only, with no cryptographic dimension
          - No executive able to name who owns AI system identity and integrity
          - AI governance strategy silent on agents that call tools and APIs on the organization's behalf

        Evidence Examples by Level:
          - Level 2: Meeting notes acknowledging AI systems need identity/integrity controls; informal awareness materials
          - Level 3: Board or steering-group briefing on AI system cryptographic risk; AI trust roadmap; budget line for AI identity/signing; named accountable owner
          - Level 4: AI cryptographic governance integrated into the strategic planning cycle and ERM; quarterly steering review; KRIs for AI identity/provenance coverage
          - Level 5: Published thought leadership; contribution to AI identity/provenance standards; strategy anticipates multi-agent and cross-organizational trust
      references:
      - eu-ai-act
      - dora
      - nist-ai-rmf
      - iso-iec-42001
      levels:
      - number: 1
        name: Initial
        description: |
          - No recognition that AI models or agents are cryptographic actors
          - Strategy documents silent on AI system identity, integrity, or provenance
          - Executive sponsors unaware of AI system cryptographic governance as a concern distinct from PKI
          - AI systems deployed with no consideration of who or what they are, cryptographically
      - number: 2
        name: Foundational
        description: |
          - General awareness that AI systems introduce trust concerns beyond the underlying PKI
          - AI cryptographic governance mentioned informally but not incorporated into strategy
          - Executive sponsors aware of the topic but not prioritizing or funding it
          - No formal assessment of which AI systems are in regulatory scope
          - Ownership of the AI system layer is unassigned or ambiguous
      - number: 3
        name: Advanced
        description: |
          - Strategy explicitly addresses AI system cryptographic governance as a priority distinct from PKI maturity
          - Executive sponsorship formally extended to AI identity, model integrity, and output provenance
          - In-scope AI systems for the EU AI Act (high-risk) and/or DORA identified
          - Accountable owner assigned for AI system cryptographic governance
          - Roadmap includes AI trust milestones aligned to regulatory deadlines
          - Budget allocated for AI identity, signing, and provenance capabilities
      - number: 4
        name: Managed
        description: |
          - AI system cryptographic governance fully integrated into the strategic planning cycle
          - Executive sponsorship active and sustained across affected business and product units
          - AI trust risk represented in the Enterprise Risk Management framework
          - Key Risk Indicators defined for AI identity coverage, model signing coverage, and provenance
          - Strategy reviewed against evolving AI regulation and standards
          - Multi-year budget secured for AI trust infrastructure
      - number: 5
        name: Optimized
        description: |
          - AI system cryptographic governance treated as a competitive differentiator and trust enabler
          - Organization positioned as verifiably trustworthy in AI ahead of regulatory mandates
          - Strategy anticipates multi-agent ecosystems and cross-organizational AI trust
          - Executive sponsors engaged in AI identity and provenance standards initiatives
          - Strategy enables crypto-agility for the AI layer as an ongoing capability, not a one-time project
    - id: policies-and-documentation
      weight: 4
      guidance: |
        The policy framework must extend to the AI system layer. This means documented policy for AI system identity (what identity an AI system or agent is issued, how it is bound to an accountable owner or sponsor, and what authority it may exercise), for model integrity and provenance (which model artifacts must be signed, and what provenance must be verified before a model is deployed), and for output provenance where applicable (for example C2PA manifests for AI-generated content). Approved-algorithm lists must cover AI use: model-artifact signing, agent credential algorithms, and inference-endpoint transport.
        Where the organization operates a certificate policy and practice statement, these should be extended — or a parallel AI trust policy established — to define agent credential profiles, delegation rules, revocation triggers (including cascade revocation on sponsor offboarding), and the AI-BOM / ML-BOM required for each AI system. RFC 3647 remains a useful structural template even where the subject is an AI agent rather than a human or classical device.
        Persona split: a provider's policy governs the production side — which artifacts it signs, under what signing policy, and what provenance and attestations it publishes with distributed models. A deployer's policy governs the consumption side — which signatures and attestations it requires from upstream providers, which trust anchors it accepts, and what verification must pass before a procured model enters service. Organizations holding both roles maintain both; role assignment follows the EU AI Act value-chain rules (Article 25), under which a deployer that substantially modifies or rebrands a system becomes its provider.
      assessment: |
        Key Probes:
          - Is there a documented policy governing AI system and agent identity, including owner/sponsor binding and permitted authority?
          - Does policy require model artifacts to be signed and their provenance verified before deployment?
          - Do approved-algorithm lists explicitly cover model signing, agent credentials, and inference transport?
          - Is an AI-BOM / ML-BOM required and specified per AI system?
          - Are revocation triggers for AI credentials documented, including cascade revocation?
          - Which roles does the organization hold — provider, deployer, or both — and does policy cover each held role's side (signing and publication versus verification and vendor requirements)?

        Warning Signs:
          - CP/CPS or trust policy makes no mention of AI systems, agents, or model artifacts
          - Agents issued long-lived, broadly-scoped credentials with no documented profile
          - No policy on model provenance verification — models loaded on trust
          - Output provenance (C2PA or equivalent) not addressed for generative systems

        Evidence Examples by Level:
          - Level 2: Internal memo acknowledging policy gaps for AI systems; informal inventory of AI systems and their credentials
          - Level 3: AI trust policy or CP/CPS amendment covering agent identity, model signing, and provenance; approved-algorithm list with AI entries; ML-BOM template
          - Level 4: Published AI trust policy; algorithm governance covering the AI layer; ML-BOM integrated with the SDLC; documented delegation and cascade-revocation rules
          - Level 5: Policy templates shared with the ecosystem; policy anticipates multi-agent delegation and cross-domain trust; provenance policy aligned with emerging standards
      references:
      - rfc-3647
      - eu-ai-act
      - iso-iec-42001
      - cyclonedx-mlbom
      - c2pa
      levels:
      - number: 1
        name: Initial
        description: |
          - Policy framework silent on AI system identity, model integrity, and provenance
          - No approved-algorithm coverage for model signing, agent credentials, or inference transport
          - No AI-BOM / ML-BOM requirement
          - Agent and AI system credentials, where they exist, are undocumented
      - number: 2
        name: Foundational
        description: |
          - Awareness that policy must be extended to AI systems, but no changes made
          - AI systems and their credentials inventoried informally, not in policy
          - No documented model provenance verification requirement
          - Delegation and revocation rules for AI credentials undefined
      - number: 3
        name: Advanced
        description: |
          - AI trust policy (or CP/CPS extension) formally covers AI system and agent identity, owner/sponsor binding, and permitted authority
          - Approved-algorithm list includes model signing, agent credentials, and inference transport, with lifecycle and deprecation dates
          - Model provenance verification is required before deployment
          - Provider: model artifacts are signed under a documented signing policy before distribution, with provenance published alongside
          - Deployer: required upstream signatures and attestations are documented for procured models and agents
          - AI-BOM / ML-BOM specified and required per AI system
          - Revocation triggers documented, including cascade revocation on sponsor offboarding
      - number: 4
        name: Managed
        description: |
          - AI trust policy published and enforced; algorithm governance covers the AI layer with periodic review
          - ML-BOM generated and maintained, integrated with the SDLC
          - Delegation rules (for example scoped token exchange) and revocation are policy-governed and audited
          - Output provenance policy in force for generative systems where applicable
          - Cross-functional policy governance includes AI/ML, security, legal, and compliance
      - number: 5
        name: Optimized
        description: |
          - Policy documentation treated as a strategic asset for demonstrable AI trust
          - Algorithm and provenance governance anticipates regulatory and standards evolution
          - ML-BOM integrated with ERM, supply-chain security, and incident response
          - Policy enables crypto-agility for the AI layer through abstract, modular specifications
          - Contribution to ecosystem policy and provenance standards
    - id: compliance
      weight: 5
      guidance: |
        The AI system layer carries its own binding regulatory obligations with a cryptographic dimension. The EU AI Act requires high-risk AI systems to keep tamper-evident, automatically generated logs enabling traceability (Article 12) and to achieve appropriate cybersecurity against data poisoning, model poisoning, adversarial examples, and confidentiality attacks (Article 15); the Commission and market-surveillance authorities treat the agent action layer — API and tool calls, including calls to MCP servers — as in scope. For financial entities, DORA extends ICT risk management to AI systems in the estate. NIST AI RMF and ISO/IEC 42001 provide the governance scaffolding.
        The Act assigns obligations by role. Providers of high-risk AI systems carry the provider duties (Article 16), including keeping the automatically generated logs (Article 19); deployers carry the deployer duties (Article 26), including retaining the logs under their control for at least six months (Article 26(6)). Role assignment follows the value chain (Article 25) — a deployer that substantially modifies or rebrands a system becomes its provider — so the compliance mapping must reflect the roles the organization actually holds.
        Compliance maturity is about mapping these obligations to concrete cryptographic controls (identity, integrity, provenance, tamper-evident logging) and evidencing them under audit — not achieving PKI-layer certification and assuming the AI layer is covered. The core risk the extension addresses is precisely this: an organization can demonstrate strong PKI-layer maturity while its AI systems remain cryptographically ungoverned and non-conformant with AI-specific requirements.
      assessment: |
        Sector and Regime Considerations:
          - EU high-risk AI (Article 6 / Annex III): Article 12 traceability logging and Article 15 cybersecurity apply, including to the agent action layer
          - Financial services (EU): DORA ICT risk management extends to AI systems
          - Any AI management system: ISO/IEC 42001 provides certifiable governance controls
          - US and international: NIST AI RMF (Govern/Map/Measure/Manage) as a voluntary baseline
          - Role split: provider obligations (Article 16, Article 19 logs) versus deployer obligations (Article 26, including Article 26(6) log retention) — mapped to the roles the organization holds, with Article 25 role-conversion checked

        Warning Signs:
          - Compliance team cannot articulate EU AI Act Article 12 / Article 15 obligations or their cryptographic implications
          - No regulatory mapping covering the AI system layer distinct from PKI
          - Audit scope covers PKI but not AI system identity, integrity, or logging
          - Assumption that PKI-layer certification implies AI-layer conformance

        Evidence Examples by Level:
          - Level 2: Informal tracking of AI regulation; awareness communications
          - Level 3: Regulatory mapping for the AI layer (EU AI Act, DORA, ISO/IEC 42001); gap analysis; compliance roadmap with AI milestones
          - Level 4: Quarterly compliance status covering AI systems; audit including AI identity, provenance, and Article 12 logging; ISO/IEC 42001 alignment evidence
          - Level 5: Regulatory consultation participation; standards engagement; audit program exceeding minimum AI-layer requirements
      references:
      - eu-ai-act
      - dora
      - iso-iec-42001
      - nist-ai-rmf
      - iso-37301
      levels:
      - number: 1
        name: Initial
        description: |
          - No awareness of AI-specific regulatory requirements with a cryptographic dimension
          - Compliance framework does not reference the EU AI Act, DORA (for the AI estate), or AI management standards
          - Audit scope excludes AI system identity, integrity, and logging
          - AI-layer conformance assumed to follow from PKI-layer controls
      - number: 2
        name: Foundational
        description: |
          - General awareness that AI systems carry compliance obligations
          - No formal mapping of AI-layer requirements to cryptographic controls
          - Audit scope unchanged; AI systems not covered
          - EU AI Act Article 12 / Article 15 implications tracked only informally
      - number: 3
        name: Advanced
        description: |
          - Formal regulatory mapping completed for the AI system layer, covering as applicable:
            - EU AI Act Article 12 (tamper-evident traceability logging) and Article 15 (cybersecurity), including the agent action layer
            - DORA ICT risk management for AI systems (financial entities)
            - ISO/IEC 42001 AI management system controls
            - NIST AI RMF functions
            - Provider (Article 16) and deployer (Article 26) obligations mapped to the roles the organization holds, including Article 25 role-conversion analysis
          - Gap analysis conducted against applicable AI-layer requirements
          - Compliance roadmap developed with AI milestones aligned to regulatory deadlines
          - Audit criteria extended to AI system identity, integrity, provenance, and logging
      - number: 4
        name: Managed
        description: |
          - Active compliance program executing against AI-layer requirements
          - AI system cryptographic risk monitored consistently with DORA ICT risk expectations
          - Quarterly compliance status reporting covers AI systems
          - Audit program verifies AI identity coverage, model provenance, ML-BOM completeness, and Article 12 log integrity
          - ISO/IEC 42001 alignment demonstrated
      - number: 5
        name: Optimized
        description: |
          - Compliance program anticipates and helps shape AI-layer regulation and standards
          - Audit program sets an industry benchmark, exceeding minimum AI requirements
          - AI-layer compliance integrated with ERM and quantified
          - Continuous improvement with effectiveness metrics and post-regulatory-change reviews
          - Cross-border AI compliance handled with a harmonized approach
    - id: processes-and-procedures
      weight: 4
      guidance: |
        Operating the AI system layer introduces procedures with no classical-PKI equivalent: issuing and binding agent identities to accountable owners, onboarding and offboarding agents (including cascade revocation of an agent's credentials and any delegated tokens when a sponsor leaves or an agent is decommissioned), conducting model-signing ceremonies, and verifying model provenance before deployment. Delegation of authority to an agent — for example via scoped token exchange — is itself a procedure requiring dual control and documented scope.
        Incident response must cover cryptographic events specific to AI systems: compromise of an agent credential or model-signing key, detection of a tampered or unsigned model in the pipeline, or a provenance-verification failure at deployment. Segregation of duties should extend to AI trust roles (for example an AI identity operator and a model-signing authority), and procedures should support rapid, tested revocation given that agent populations can be large and short-lived.
        Persona split: providers operate the production-side procedures — model-signing ceremonies, provenance generation, and publication of attestations with each release. Deployers operate the consumption side — provenance verification as a deployment gate, intake of vendor attestations, and response to upstream security advisories affecting procured models. Agent identity lifecycle, delegation, and incident response apply to both roles.
      assessment: |
        Key Probes:
          - Is there a documented procedure for issuing agent identities and binding them to an accountable owner?
          - How are agents offboarded, and does offboarding trigger cascade revocation of credentials and delegated tokens?
          - Is there a model-signing ceremony and a provenance-verification step before deployment?
          - How would the organization respond to a compromised agent credential or a tampered model in the pipeline?
          - Who is the designated owner of AI trust operations, and is dual control enforced for model signing and delegation?

        Warning Signs:
          - Agents created and destroyed with no identity issuance or revocation procedure
          - Sponsor offboarding does not revoke the agents acting on that sponsor's authority
          - Models deployed without a signing ceremony or provenance check
          - Incident response has no play for AI credential compromise or model tampering

        Evidence Examples by Level:
          - Level 2: Discussion threads on AI trust procedures; collected vendor guidance
          - Level 3: Documented agent onboarding/offboarding with cascade revocation; model-signing ceremony script; provenance-verification step; incident playbook with AI scenarios
          - Level 4: Completed signing-ceremony records; tested cascade revocation; tabletop exercises for AI credential/model events; enforced segregation of duties
          - Level 5: Revocation demonstrably fast across large agent populations; automated detection of unsigned/tampered models; published playbooks; contribution to procedure standards
      references:
      - nist-sp-800-61
      - rfc-8693
      - slsa
      - in-toto
      levels:
      - number: 1
        name: Initial
        description: |
          - Procedures do not reference AI system identity, model signing, or provenance
          - Agents, where used, are created and retired ad hoc with no identity lifecycle
          - No model-signing ceremony or provenance-verification step
          - Incident response omits AI-specific cryptographic scenarios
          - Segregation of duties does not address AI trust roles
      - number: 2
        name: Foundational
        description: |
          - Awareness that AI trust procedures are needed, but not documented
          - Agent identity and offboarding handled informally
          - Model provenance verification recognized as desirable but not procedural
          - Delegation of authority to agents is undocumented
      - number: 3
        name: Advanced
        description: |
          - Agent identity issuance and owner binding formally documented
          - Onboarding and offboarding procedures include cascade revocation of agent credentials and delegated tokens
          - Provider: model-signing ceremony documented (quorum, key activation, artifact signing)
          - Deployer: vendor attestation intake and upstream security-advisory response documented
          - Provenance verification is a required deployment gate
          - Incident response extended to agent credential compromise, model tampering, and provenance-verification failure
          - AI trust roles defined; dual control required for model signing and delegation
      - number: 4
        name: Managed
        description: |
          - Procedures actively support AI trust operations at scale
          - Provider: signing ceremonies conducted and evidenced
          - Provenance verification enforced in the pipeline for all models entering service
          - Cascade revocation tested and validated
          - Incident response exercised through tabletop scenarios including AI cryptographic events
          - Segregation of duties enforced and verified through audit
      - number: 5
        name: Optimized
        description: |
          - Procedures embody rapid, automated revocation across large and short-lived agent populations
          - Automated detection of unsigned or tampered models blocks deployment
          - Delegation procedures support scoped, attenuated, time-bound authority by default
          - Incident response coordinated with external parties where multi-agent trust crosses organizations
          - Procedures generalize to future AI trust patterns and contribute to standards
    - id: cryptography
      weight: 5
      guidance: |
        This is the category where the AI-layer governance gap is most directly closed. Cryptographic visibility must extend to AI systems: models, agents, inference endpoints, and their keys and algorithms must appear in the cryptographic inventory (and in the CBOM / ML-BOM), not sit outside it. Approved algorithms must cover model-artifact signing, agent credential issuance, and inference transport. Cryptographic lifecycle and deprecation rules must apply to AI-embedded cryptography — including signing algorithms baked into model-provenance chains and long-lived signed artifacts.
        Crypto-agility must reach the AI layer: the organization should be able to rotate the algorithm used to sign model artifacts, the algorithm backing agent credentials, and inference-endpoint transport without re-architecting. This layer also inherits the quantum threat — harvest-now-decrypt-later applies to confidential inference traffic and to long-lived signed model provenance — so the AI layer's algorithms should be on a path to the NIST PQC standards (ML-KEM, ML-DSA, SLH-DSA) in step with the infrastructure. An organization can operate a quantum-safe, well-governed PKI while its AI systems still rely on quantum-vulnerable, ungoverned cryptography; this category exists to detect and close that gap.
        Persona split: a provider governs the algorithms it uses to sign and attest what it distributes; a deployer governs the algorithms and trust anchors it accepts when verifying procured models. Inference-transport and agent-credential algorithm governance applies to both roles.
      assessment: |
        Key Probes:
          - Do AI systems (models, agents, inference endpoints) appear in the cryptographic inventory / CBOM / ML-BOM?
          - Are approved algorithms defined for model signing, agent credentials, and inference transport?
          - Can the organization rotate the model-signing algorithm and the agent credential algorithm without re-architecting?
          - Are AI-layer algorithms on a documented path to the NIST PQC standards, in step with the PKI?
          - Are deprecation rules applied to cryptography embedded in model-provenance chains?

        Warning Signs:
          - AI systems are absent from the cryptographic inventory
          - Model artifacts signed (or not) with unmanaged, unapproved algorithms
          - Inference endpoints using cryptography chosen by defaults, not governed
          - No path to PQC for the AI layer even where the PKI has one

        Evidence Examples by Level:
          - Level 2: Informal note that AI systems use cryptography; partial, manual inventory
          - Level 3: AI systems included in the CBOM/ML-BOM; approved-algorithm list covers AI uses; documented crypto-agility approach for the AI layer; PQC path identified
          - Level 4: Automated cryptographic discovery covering AI systems; governed algorithm add/deprecate for the AI layer; tested algorithm substitution for model signing
          - Level 5: Continuous visibility across all AI systems; algorithm substitution achievable rapidly; AI layer PQC migration coordinated with the PKI; contribution to inventory/agility standards
      references:
      - cyclonedx-cbom
      - cyclonedx-mlbom
      - nist-cswp-39
      - eucc-crypto-inventory
      - nist-fips-203
      - nist-fips-204
      - nist-fips-205
      levels:
      - number: 1
        name: Initial
        description: |
          - AI systems are not represented in any cryptographic inventory
          - No approved-algorithm coverage for model signing, agent credentials, or inference transport
          - Cryptography embedded in AI systems is chosen ad hoc and ungoverned
          - No lifecycle, deprecation, or agility consideration for AI-layer cryptography
      - number: 2
        name: Foundational
        description: |
          - Awareness that AI systems use cryptography that should be governed
          - Partial or manual inventory of AI-system cryptography exists
          - Approved-algorithm lists do not yet cover AI uses
          - No documented crypto-agility or PQC path for the AI layer
      - number: 3
        name: Advanced
        description: |
          - AI systems (models, agents, inference endpoints) are included in the cryptographic inventory / CBOM / ML-BOM
          - Approved-algorithm list covers model signing, agent credentials, and inference transport
          - Deployer: accepted algorithms and trust anchors for verifying procured models are defined and governed
          - Cryptographic lifecycle and deprecation rules apply to AI-embedded cryptography, including model-provenance chains
          - Crypto-agility approach for the AI layer documented (ability to rotate model-signing and agent-credential algorithms)
          - Path to the NIST PQC standards for the AI layer identified, in step with the PKI
      - number: 4
        name: Managed
        description: |
          - Cryptographic discovery for AI systems is automated and maintained
          - Algorithm add/deprecate for the AI layer is governed with periodic review
          - Algorithm substitution for model signing and agent credentials is tested with validated rollback
          - AI-layer PQC migration is planned and tracked alongside the PKI
      - number: 5
        name: Optimized
        description: |
          - Continuous, complete cryptographic visibility across all AI systems
          - Algorithm substitution across the AI trust chain achievable rapidly, not as a project
          - Confidential inference and long-lived signed provenance protected on a quantum-safe path
          - Organization contributes to cryptographic inventory and agility standards for AI systems
  - id: M
    categories:
    - id: key-management
      weight: 4
      guidance: |
        AI systems introduce new key material to manage: agent private keys (often high-volume and short-lived), model-signing keys (high-value, long-lived, ideally HSM-backed), and keys protecting confidential inference. Key management roles, inventory, and lifecycle procedures must explicitly cover these. Model-signing keys warrant the strongest protection because a compromise lets an attacker forge model provenance for the whole estate; agent keys warrant automated, short-lifetime handling because their populations are large and churn quickly.
        The key inventory and device inventory should include AI-system keys and the HSMs or key stores backing them, and key-management review should confirm that AI-layer key handling matches policy — in particular that ephemeral agent keys are genuinely short-lived and that model-signing keys are held under dual control in hardware.
        Persona split: model-signing keys are a provider concern — a deployer that only consumes third-party models holds no model-signing keys, but must instead manage the verification trust anchors (provider signing certificates and public keys) it relies on, with the same inventory, protection, and review discipline. Agent and inference keys apply to both roles.
      assessment: |
        Key Probes:
          - Are agent keys, model-signing keys, and inference keys covered by key-management roles and procedures?
          - Provider: are model-signing keys HSM-backed and under dual control?
          - Deployer: are verification trust anchors for procured models inventoried and protected?
          - Are agent keys short-lived and automatically rotated?
          - Do the key and device inventories include AI-system keys and their backing stores?
          - Does key-management review cover the AI layer?

        Warning Signs:
          - Model-signing keys held in software with no dual control
          - Long-lived agent keys with no rotation
          - AI-system keys absent from the inventory
          - No lifecycle defined for ephemeral agent identities

        Evidence Examples by Level:
          - Level 2: Informal awareness of AI-system keys; partial inventory
          - Level 3: Documented lifecycle for agent and model-signing keys; HSM backing for signing keys; AI keys in the inventory
          - Level 4: Automated agent key rotation; dual-control signing-key ceremonies evidenced; periodic AI-layer key review
          - Level 5: Fully automated, policy-driven key lifecycle for large agent populations; signing-key protection benchmarked; agility for AI-layer key algorithms
      references:
      - nist-sp-800-57
      - iso-11770
      levels:
      - number: 1
        name: Initial
        description: |
          - Key-management roles and procedures do not address AI-system keys
          - Agent, model-signing, and inference keys are handled ad hoc
          - AI-system keys are not inventoried
          - No lifecycle defined for ephemeral agent identities
      - number: 2
        name: Foundational
        description: |
          - Awareness that AI systems introduce new key material to manage
          - Partial inventory of AI-system keys
          - Model-signing key protection not yet defined
          - Agent key rotation not established
      - number: 3
        name: Advanced
        description: |
          - Key-management roles and procedures explicitly cover agent, model-signing, and inference keys
          - Provider: model-signing keys are HSM-backed and held under dual control
          - Deployer: verification trust anchors for procured models are inventoried, protected, and reviewed
          - Agent keys have a defined short lifecycle
          - Key and device inventories include AI-system keys and their backing stores
          - Key-management review covers the AI layer
      - number: 4
        name: Managed
        description: |
          - Agent key issuance and rotation are automated at population scale
          - Signing-key ceremonies conducted under dual control and evidenced
          - AI-layer key management reviewed periodically against policy
          - Provider: recovery and compromise procedures defined for model-signing keys
          - Deployer: upstream trust-anchor rotation and provider-compromise response procedures defined
      - number: 5
        name: Optimized
        description: |
          - Fully automated, policy-driven key lifecycle for large and short-lived agent populations
          - Model-signing key protection benchmarked and continuously assured
          - AI-layer key algorithms are agile and on a quantum-safe path
          - Key-management practice for AI systems informs standards and peers
    - id: certificate-management
      weight: 5
      guidance: |
        Agent and workload identity is the flagship of AI system cryptographic governance. Certificate and credential profiles must be defined for AI systems: X.509 identities that bind an agent to an accountable owner or sponsor (for example via a dedicated owner extension) and to a workload identity such as a SPIFFE ID carried as a URI SAN, or JWT-based workload credentials. The lifecycle for these credentials differs sharply from classical certificates — populations are large, lifetimes are short, issuance and renewal are continuous, and revocation must be able to cascade when a sponsor is offboarded or an agent is decommissioned.
        The organization needs an inventory of issued AI-system credentials and a discovery process able to find agents and workloads that hold identities, so that no agent acts on organizational authority without being accounted for. Certificate-management review should confirm that agent credential profiles, lifetimes, and revocation behavior match policy, and that discovery coverage keeps pace with a fast-changing agent population.
        Persona note: agent and workload identity criteria apply to both roles. Providers additionally manage the identities and certificates bound into distributed artifacts and attestations so that relying deployers can verify them.
      assessment: |
        Key Probes:
          - Are credential profiles defined for AI agents and workloads (owner/sponsor binding, workload identity such as SPIFFE)?
          - Is the agent credential lifecycle designed for high volume and short lifetimes, with continuous issuance and renewal?
          - Can revocation cascade from a sponsor to the agents acting on that sponsor's authority?
          - Is there an inventory of issued AI-system credentials and a discovery process to find agents/workloads?
          - Does certificate-management review cover the AI layer?

        Warning Signs:
          - Agents share a generic credential or use static secrets instead of managed identities
          - Long-lived agent certificates that are never rotated
          - No discovery for agent/workload identities — unknown agents may hold credentials
          - Revocation cannot reach agents when their sponsor leaves

        Evidence Examples by Level:
          - Level 2: Informal list of agents holding credentials; awareness of workload identity concepts
          - Level 3: Documented agent/workload credential profiles; short-lifetime lifecycle; inventory and discovery established; cascade revocation defined
          - Level 4: Automated issuance/renewal at scale; discovery coverage metrics; tested cascade revocation; periodic AI-layer review
          - Level 5: Continuous, comprehensive agent identity coverage; federated workload identity across domains; revocation demonstrably fast and complete
      references:
      - rfc-5280
      - spiffe
      - rfc-4210
      - cab-baseline-requirements
      levels:
      - number: 1
        name: Initial
        description: |
          - No credential profiles for AI agents or workloads
          - Agents use shared credentials or static secrets, if any identity at all
          - No inventory or discovery of AI-system credentials
          - Revocation for AI credentials is undefined
      - number: 2
        name: Foundational
        description: |
          - Awareness that agents and workloads need managed identities
          - Partial inventory of agents holding credentials
          - Credential profiles for AI systems not yet defined
          - No discovery process for agent/workload identities
      - number: 3
        name: Advanced
        description: |
          - Credential profiles defined for AI agents and workloads, with owner/sponsor binding and workload identity (for example SPIFFE URI SAN)
          - Agent credential lifecycle designed for high volume and short lifetimes
          - Inventory of issued AI-system credentials maintained
          - Discovery process finds agents and workloads holding identities
          - Cascade revocation from sponsor to dependent agents defined
      - number: 4
        name: Managed
        description: |
          - Issuance and renewal of agent credentials automated at population scale
          - Discovery coverage measured and maintained against a changing agent population
          - Cascade revocation tested and validated
          - Certificate-management review covers the AI layer periodically
      - number: 5
        name: Optimized
        description: |
          - Continuous, comprehensive identity coverage for all agents and workloads
          - Workload identity federated across trust domains for multi-agent and cross-organizational use
          - Revocation demonstrably fast and complete across the agent population
          - Agent identity practice informs standards and the wider ecosystem
    - id: infrastructure-management
      weight: 3
      guidance: |
        The infrastructure that trains, hosts, and serves AI systems is part of the trust boundary and should be documented and governed from a cryptographic standpoint: where model artifacts are stored and signed, where signing and agent keys live, where inference endpoints terminate transport, and how these are segmented from general workloads. Vulnerability management should cover AI-serving components (model registries, inference gateways, agent runtimes), and infrastructure recovery objectives should include the AI identity and signing services on which the AI layer depends.
        Segmentation matters because a compromise of AI-serving infrastructure can expose signing keys or allow tampered models into the pipeline; documenting and separating these components limits blast radius and supports the Article 15 cybersecurity expectations for high-risk systems.
      assessment: |
        Key Probes:
          - Is the infrastructure hosting model storage, signing, agent runtimes, and inference endpoints documented from a trust standpoint?
          - Are AI-serving components segmented from general workloads?
          - Does vulnerability management cover model registries, inference gateways, and agent runtimes?
          - Are AI identity and signing services included in infrastructure recovery objectives?

        Warning Signs:
          - Model-signing infrastructure co-located with general workloads
          - AI-serving components excluded from vulnerability management
          - No recovery objective for AI identity/signing services
          - Inference endpoints undocumented as trust boundaries

        Evidence Examples by Level:
          - Level 2: Partial documentation of AI-serving infrastructure; informal awareness of exposure
          - Level 3: Documented AI trust infrastructure; segmentation applied; vulnerability management extended to AI-serving components; recovery objectives include AI identity/signing
          - Level 4: Regular review of AI infrastructure; segmentation verified; recovery objectives tested
          - Level 5: AI trust infrastructure continuously assured and resilient by design
      references:
      - iso-27001
      - nist-csf-identify
      levels:
      - number: 1
        name: Initial
        description: |
          - Infrastructure hosting AI systems is not documented as a trust boundary
          - No segmentation of AI-serving components
          - Vulnerability management excludes AI-serving infrastructure
          - AI identity and signing services absent from recovery objectives
      - number: 2
        name: Foundational
        description: |
          - Partial documentation of AI-serving infrastructure
          - Awareness of exposure from model storage and signing infrastructure
          - Segmentation not yet applied
          - Recovery objectives do not yet include AI services
      - number: 3
        name: Advanced
        description: |
          - AI trust infrastructure documented (model storage, signing, agent runtimes, inference endpoints)
          - Segmentation applied to separate AI-serving components from general workloads
          - Vulnerability management extended to model registries, inference gateways, and agent runtimes
          - Recovery objectives include AI identity and signing services
      - number: 4
        name: Managed
        description: |
          - AI infrastructure reviewed regularly; segmentation verified
          - Vulnerability management for AI-serving components is routine
          - Recovery objectives for AI services are tested
      - number: 5
        name: Optimized
        description: |
          - AI trust infrastructure continuously assured, segmented, and resilient by design
          - Recovery of AI identity and signing services is rapid and validated
          - Infrastructure practice for AI systems informs standards and peers
    - id: change-management-and-agility
      weight: 4
      guidance: |
        Changes to the AI trust chain — the algorithm used to sign model artifacts, the algorithm backing agent credentials, inference-endpoint transport, or the delegation model — must flow through change management with the ability to roll back a failed change. Agility requirements should be explicit for the AI layer: the organization should identify, up front, what it must be able to change (algorithms, credential profiles, revocation behavior, provenance formats) and design so those changes do not require re-architecting.
        This capability is what lets the AI layer keep pace with cryptographic deprecation and the PQC transition without emergency rework, and it is what makes rapid response to an AI-layer cryptographic incident (rotating a compromised signing algorithm, tightening agent scope) feasible rather than heroic.
      assessment: |
        Key Probes:
          - Do changes to AI-layer cryptography (model-signing algorithm, agent credentials, inference transport) flow through change management with rollback?
          - Are agility requirements for the AI layer identified explicitly?
          - Can the organization substitute an AI-layer algorithm without re-architecting?
          - Is change management for the AI layer reviewed and improved?

        Warning Signs:
          - AI-layer cryptographic changes made outside change control
          - No rollback plan for a failed model-signing or credential change
          - Agility for the AI layer assumed but never specified or tested
          - Algorithm changes in the AI trust chain require re-architecting

        Evidence Examples by Level:
          - Level 2: Awareness that AI-layer changes need control; informal handling
          - Level 3: AI-layer changes in the change process; documented agility requirements; rollback defined
          - Level 4: Tested AI-layer algorithm substitution with validated rollback; agility requirements verified; periodic review
          - Level 5: Rapid, low-risk change across the AI trust chain via pre-approved templates; agility as a standing capability
      references:
      - nist-cswp-39
      levels:
      - number: 1
        name: Initial
        description: |
          - Changes to AI-layer cryptography are made ad hoc, outside change control
          - No rollback for failed AI-layer cryptographic changes
          - Agility requirements for the AI layer are not identified
          - Algorithm changes in the AI trust chain require re-architecting
      - number: 2
        name: Foundational
        description: |
          - Awareness that AI-layer cryptographic changes need managed change and agility
          - AI-layer changes handled informally
          - Rollback not defined for AI-layer changes
          - Agility requirements not documented
      - number: 3
        name: Advanced
        description: |
          - Changes to the AI trust chain flow through change management with rollback
          - Agility requirements for the AI layer are explicitly identified
          - Algorithm and credential-profile substitution is designed for without re-architecting
          - Change management for the AI layer is documented and followed
      - number: 4
        name: Managed
        description: |
          - AI-layer algorithm substitution is tested with validated rollback
          - Agility requirements are verified against real changes
          - Change management for the AI layer is reviewed and improved periodically
      - number: 5
        name: Optimized
        description: |
          - Rapid, low-risk change across the AI trust chain via pre-approved templates
          - Crypto-agility for the AI layer is a standing capability, not a project
          - Change practice for AI systems informs standards and peers
  - id: O
    categories:
    - id: resilience
      weight: 4
      guidance: |
        AI system cryptographic risk belongs in risk assessment and business impact analysis: the impact of a compromised model-signing key (forged provenance across the estate), of an agent identity service outage (agents unable to authenticate or be revoked), or of a tampered model reaching production. Incident planning and business continuity should account for these, and technology future-proofing should carry the AI layer onto a quantum-safe path in step with the PKI, since confidential inference and long-lived signed provenance are exposed to harvest-now-decrypt-later.
        Resilience maturity also covers competence and information sharing (AI trust is a fast-moving field spanning security, ML, and compliance) and continual improvement, so that lessons from AI-layer incidents and near-misses feed back into controls.
        Persona split: the provider-side worst case is model-signing-key compromise, which forges provenance for every downstream consumer; the deployer-side worst case is compromise of an upstream provider — a tampered third-party model or a revoked provider trust anchor — which the deployer must be able to detect, contain, and replace.
      assessment: |
        Key Probes:
          - Does risk assessment / BIA include AI-system cryptographic scenarios (signing-key compromise, agent identity outage, tampered model)?
          - Does incident planning cover AI-layer cryptographic events?
          - Does business continuity address AI identity and signing services?
          - Is the AI layer on a quantum-safe future-proofing path in step with the PKI?

        Warning Signs:
          - AI cryptographic risk absent from the risk register
          - No continuity plan for AI identity/signing services
          - Future-proofing addresses the PKI but not the AI layer
          - No mechanism to learn from AI-layer incidents

        Evidence Examples by Level:
          - Level 2: Informal awareness of AI cryptographic risk
          - Level 3: AI cryptographic scenarios in the risk register and BIA; continuity provisions for AI identity/signing; AI-layer PQC future-proofing identified
          - Level 4: Quarterly review of AI cryptographic risk; tested continuity for AI services; cross-functional competence sharing
          - Level 5: AI cryptographic resilience anticipated and continuously improved; scenario planning across the AI trust chain
      references:
      - iso-27005
      - iso-22301
      - iso-22317
      - nist-sp-800-34
