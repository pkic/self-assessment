relevance:
  modules:
  - id: G
    categories:
    - id: strategy-and-vision
      weight: 4
      guidance: |
        AI systems are cryptographic actors. A model is a signed artifact with a provenance chain; an agent holds an identity and acts on delegated organizational authority; an inference endpoint is a trust boundary. None of this is governed automatically by a mature PKI — the infrastructure layer can be in excellent shape while every model in production is unsigned and every agent is anonymous. Strategy earns maturity here when leadership treats the AI layer as a trust domain of its own: a named accountable owner, a budget that funds agent identity, model signing, and provenance infrastructure, and a roadmap whose dates are anchored to real obligations — the EU AI Act's high-risk provisions applying from August 2026, and DORA's ICT risk expectations for financial entities.
        The strategy should also settle the architectural questions early, because they are expensive to revisit: how agents are identified and bound to accountable owners, where model signing sits in the release path, how delegation is scoped, and how revocation cascades when a sponsor leaves.
      assessment: |
        Interview the executive sponsor and the person they name as accountable owner — the first test is whether both can be named at all, and whether they name the same scope. Ask the owner three questions: which AI systems are in regulatory scope and why, what the budget funds this year, and what happens on the roadmap before the next regulatory deadline. Then check the answers against paper. Evidence: the strategy or roadmap document, the budget line, the risk-register entry for AI cryptographic risk, board or steering-group material that shows the topic has been decided rather than merely mentioned. The decisive negative finding: nobody in the organization can say who owns AI system cryptographic governance — everything else in this extension inherits that vacuum.
      references:
      - eu-ai-act
      - dora
      - nist-ai-rmf
      - iso-iec-42001
      levels:
      - number: 1
        name: Initial
        description: |
          The organization does not think of its AI systems as cryptographic actors. Models ship unsigned, agents run without identities, and no strategy document acknowledges the AI layer as a trust domain. Whatever PKI strategy exists is assumed, silently, to cover it.
      - number: 2
        name: Foundational
        description: |
          The gap has been noticed — the topic appears in meeting notes, someone has raised the AI Act's implications — but nothing is owned, funded, or scheduled. Individual teams may sign a model or issue an agent credential on their own initiative; the organization as a whole has no position.
      - number: 3
        name: Advanced
        description: |
          Leadership has decided. An accountable owner is formally named, the in-scope AI systems are identified with their regulatory drivers, a budget funds identity, signing, and provenance work, and an approved roadmap sets dates against the obligations that matter. The architectural questions — agent identity model, signing topology, delegation and cascade revocation — have documented answers.
      - number: 4
        name: Managed
        description: |
          The strategy is alive rather than filed. AI cryptographic risk sits in enterprise risk management, key indicators — identity coverage, signing coverage, provenance verification rate — are reported to a steering forum on a cadence, and the roadmap is re-planned as regulation and the AI estate change. Funding is multi-year, not a one-time project.
      - number: 5
        name: Optimized
        description: |
          The organization plans past its own perimeter: strategy anticipates multi-agent and cross-organizational trust, treats cryptographic agility at the AI layer as a standing capability, and uses its verifiable AI trust posture commercially — ahead of mandates rather than in response to them. New AI initiatives inherit the trust architecture by default; there is no strategic path around it.
    - id: policies-and-documentation
      weight: 4
      guidance: |
        The policy framework must be able to answer questions that classical certificate policy never faced. May an AI agent hold standing credentials, and to whom must it be bound? What must be true of a model artifact before it is allowed into production? What accompanies AI-generated content that leaves the organization? A useful AI trust policy answers these concretely: agent credential profiles with owner and sponsor binding and permitted authority; a model integrity policy naming what is signed and what provenance is verified; approved algorithms extended to model signing, agent credentials, and inference transport; an AI-BOM / ML-BOM required per system; and revocation triggers including cascade revocation on sponsor offboarding. RFC 3647 remains a serviceable skeleton even when the subject is an agent.
        Providers write the production side — signing policy and what provenance and attestations ship with each release. Deployers write the consumption side — which upstream signatures and attestations are required, which trust anchors are accepted, and what verification a procured model must pass before service. Both sides note the EU AI Act's value-chain rule (Article 25): substantially modifying or rebranding a system makes a deployer its provider, and the policy obligations follow.
      assessment: |
        Take the policy set and interrogate it with concrete cases rather than reading it linearly: an engineer wants to deploy an open-weights model pulled from a public hub — what does policy require? A sponsor of twelve agents resigns — what does policy trigger? A generative system publishes content externally — what provenance must attach? A policy at maturity answers each case with a citable clause. Evidence: the AI trust policy or CP/CPS amendment, the approved-algorithm list with lifecycle dates for AI uses, the credential profile, the ML-BOM template, and the review record showing the policy has been maintained since first issue. The decisive negative finding: the policy corpus contains no sentence that constrains an AI system — everything AI-shaped is happening on unwritten rules.
      references:
      - rfc-3647
      - eu-ai-act
      - iso-iec-42001
      - cyclonedx-mlbom
      - c2pa
      levels:
      - number: 1
        name: Initial
        description: |
          Policy is silent on AI systems. Whether a model is signed, what identity an agent carries, and what provenance means here are decided ad hoc by whoever ships the system, and two teams answering the same question differently is normal.
      - number: 2
        name: Foundational
        description: |
          The gaps are acknowledged and partially mapped — an informal inventory of AI systems and their credentials may exist — but nothing binding has been issued. Draft language circulates; nothing can be cited.
      - number: 3
        name: Advanced
        description: |
          A formal AI trust policy is in force and answers the concrete cases: agent credential profiles with owner binding and permitted authority, signing and provenance requirements before deployment, an approved-algorithm list covering AI uses with deprecation dates, a required ML-BOM per system, and documented revocation triggers including cascade revocation. Providers have issued their signing and publication policy; deployers have issued their upstream verification and vendor-attestation requirements.
      - number: 4
        name: Managed
        description: |
          The policy is enforced and maintained: exceptions are formally granted rather than taken, reviews run on a cadence that keeps agent profiles, provenance formats, and algorithm choices current, and audit checks practice against the written rule. Policy governance spans security, AI/ML, legal, and compliance rather than living in one function.
      - number: 5
        name: Optimized
        description: |
          Policy is written for change: algorithm and format choices are specified abstractly enough that a substitution is a parameter update, not a rewrite, and the policy anticipates delegation and trust patterns the organization has not yet deployed. Relying parties can be shown the policy as evidence of posture, and provider or deployer counterparts can build against it.
    - id: compliance
      weight: 5
      guidance: |
        The AI layer carries binding obligations with a cryptographic core, and they do not transfer from PKI-layer certifications. The EU AI Act requires high-risk AI systems to generate tamper-evident logs that make their operation traceable (Article 12) and to be cyber-resilient against data and model poisoning, adversarial examples, and confidentiality attacks (Article 15) — with the agent action layer, the tool and API calls, treated as in scope. The Act then assigns duties by role: providers carry Article 16, including keeping the automatically generated logs (Article 19); deployers carry Article 26, including retaining the logs under their control for at least six months (Article 26(6)); and Article 25 converts a deployer that substantially modifies or rebrands a system into its provider. For financial entities, DORA pulls AI systems into ICT risk management. ISO/IEC 42001 and the NIST AI RMF supply the management-system scaffolding around all of it.
        Compliance maturity here means mapping each applicable obligation to a concrete cryptographic control — an identity, a signature, a verifiable log — and being able to produce the evidence under audit for the roles the organization actually holds.
      assessment: |
        Pick one in-scope high-risk AI system and ask compliance to produce its obligation mapping end to end: which articles apply, which role the organization holds for this system and why (including the Article 25 analysis), which control satisfies each obligation, and where the evidence lives. Then pull one thread — ask for the Article 12 logs of that system and the demonstration that they are tamper-evident. Evidence: the regulatory mapping, the gap analysis and remediation plan, audit criteria that name AI identity, provenance, and log integrity, and ISO/IEC 42001 or AI RMF alignment records where claimed. The decisive negative finding: the organization believes its PKI or ISMS certification answers the AI Act — the mapping exercise has never been done because it was assumed unnecessary.
      references:
      - eu-ai-act
      - dora
      - iso-iec-42001
      - nist-ai-rmf
      - iso-37301
      levels:
      - number: 1
        name: Initial
        description: |
          No one has determined which AI-layer obligations apply. The AI Act appears nowhere in the compliance universe, roles have not been analyzed, and audits scope the PKI while walking past the AI systems built on it.
      - number: 2
        name: Foundational
        description: |
          The obligations are tracked informally — someone follows the AI Act timeline, the topic is raised in compliance meetings — but there is no mapping from article to control to evidence, and no determination of which systems make the organization a provider, a deployer, or both.
      - number: 3
        name: Advanced
        description: |
          A formal mapping exists for every in-scope system: Article 12 traceability and Article 15 cybersecurity tied to named cryptographic controls, provider (Article 16, Article 19) and deployer (Article 26, Article 26(6)) duties assigned per the roles held, Article 25 conversion checked, DORA and ISO/IEC 42001 folded in where applicable. A gap analysis and a dated remediation plan exist, and audit criteria have been extended to the AI layer.
      - number: 4
        name: Managed
        description: |
          The program executes: compliance status for AI systems is reported quarterly, audits verify log integrity, provenance, and identity coverage rather than accepting their existence on paper, and regulatory change triggers a re-mapping as a matter of process. Findings close on schedule.
      - number: 5
        name: Optimized
        description: |
          Compliance is anticipatory: the organization engages with regulators and standards bodies on AI trust requirements, harmonizes obligations across jurisdictions rather than running parallel programs, and treats the audit trail it can produce as a competitive asset. New obligations land on an architecture already built to evidence them.
    - id: processes-and-procedures
      weight: 4
      guidance: |
        Operating the AI trust layer creates procedures classical PKI never needed. An agent is born: someone must issue its identity, bind it to an accountable owner, and scope its authority. An agent's sponsor leaves: the offboarding procedure must cascade — revoking the agent's credentials and every delegated token derived from that sponsor's authority. A model heads for production: providers run a signing ceremony under dual control; everyone verifies provenance as a hard deployment gate; deployers additionally operate the intake of vendor attestations and the response to upstream security advisories. And incident response must know what to do with AI-specific cryptographic events — a compromised agent credential, a tampered or unsigned model discovered in the pipeline, a provenance check that fails at deploy time.
        Segregation of duties extends to the new roles: whoever operates agent identity does not also hold the model-signing key; delegation of authority to an agent is itself a controlled procedure with documented scope, not an API call anyone may make.
      assessment: |
        Walk two lifecycles end to end. First, one agent: who requested it, who approved the binding to an owner, what scope it received, and — the sharp end — run or review a cascade revocation for a departed sponsor and observe how long the agents acting on that authority keep working. Second, one model: follow it from build to production and ask for the record of the signing ceremony (provider) or the verification log and the vendor attestation on file (deployer). Evidence: the documented procedures, the most recent ceremony record, the revocation test result, the incident playbook entries for AI cryptographic events, the tabletop exercise report. The decisive negative finding: a sponsor's departure leaves their agents credentialed and running — the procedure that matters most does not exist.
      references:
      - nist-sp-800-61
      - rfc-8693
      - slsa
      - in-toto
      levels:
      - number: 1
        name: Initial
        description: |
          Agents appear and disappear with no identity lifecycle; models reach production without a signing or verification step; and if an agent credential were compromised tonight, no runbook says what happens next. Everything AI-shaped is handled by improvisation.
      - number: 2
        name: Foundational
        description: |
          Individual teams have working habits — a script that requests agent certificates, a checklist someone follows before deploying a model — but they are personal knowledge, not organizational procedure. Offboarding does not reach agents; delegation is undocumented.
      - number: 3
        name: Advanced
        description: |
          The procedures exist, are followed, and cover the new ground: agent issuance with owner binding and scoped authority, offboarding with cascade revocation, dual-controlled signing ceremonies for providers, provenance verification as a required gate for all, vendor attestation intake and advisory response for deployers, and incident-response plays for credential compromise, model tampering, and verification failure. Duties are segregated between identity operation and signing authority.
      - number: 4
        name: Managed
        description: |
          The procedures are exercised, not just written: cascade revocation has been tested and timed, ceremonies leave complete evidence, tabletop exercises have run the AI scenarios, and audit confirms that practice matches the document. Deviations surface as findings, not surprises.
      - number: 5
        name: Optimized
        description: |
          The procedures hold at population scale and under pressure: revocation completes across large, short-lived agent fleets within policy time, unsigned or tampered models are detected and blocked without human vigilance, and delegation is scoped, attenuated, and time-bound by default. Incident response extends across organizational boundaries where agent trust does.
    - id: cryptography
      weight: 5
      guidance: |
        This is where the AI-layer gap closes or does not. Cryptographic visibility must reach the AI estate: every model, agent, and inference endpoint appears in the cryptographic inventory — the CBOM, with the ML-BOM carrying the model-specific view — with its keys and algorithms recorded, or the AI layer is ungoverned regardless of what policy says. Approved-algorithm governance must cover the AI uses: the algorithm that signs model artifacts, the algorithms behind agent credentials, and inference transport. Providers govern what they sign and attest with; deployers govern what they accept — the verification algorithms and trust anchors for procured models. Lifecycle and deprecation rules apply with a twist: signatures in model-provenance chains live as long as the models do, often far past a classical certificate's horizon.
        Agility must reach the whole AI trust chain — the organization should be able to rotate the model-signing algorithm, the agent-credential algorithm, and inference transport without re-architecting. And the quantum threat is inherited in full: harvest-now-decrypt-later applies to confidential inference traffic and to long-lived signed provenance, so AI-layer algorithms belong on a documented path to the NIST post-quantum standards — FIPS 203 ML-KEM, FIPS 204 ML-DSA, FIPS 205 SLH-DSA — in step with the organization's PKI transition. A quantum-safe, well-governed PKI with a quantum-vulnerable, invisible AI layer is precisely the failure state this category detects.
      assessment: |
        Name one production model and one running agent, then ask for their inventory entries — the algorithm that signed the model, the key backing the agent's credential, the transport protecting its inference calls. If the entries exist, test the governance around them: which document approves these algorithms, what date deprecates them, and what is the written plan for the day the model-signing algorithm must change. For deployers, ask additionally which algorithms and trust anchors they accept from upstream and where that is decided. Evidence: the CBOM/ML-BOM extract for the named systems, the approved-algorithm list with AI entries and dates, the crypto-agility statement for the AI trust chain, the post-quantum migration plan covering the AI layer. The decisive negative finding: the named model and agent are simply not in any inventory — visibility, and with it governance, ends at the PKI.
      references:
      - cyclonedx-cbom
      - cyclonedx-mlbom
      - nist-cswp-39
      - eucc-crypto-inventory
      - nist-fips-203
      - nist-fips-204
      - nist-fips-205
      levels:
      - number: 1
        name: Initial
        description: |
          The cryptographic inventory stops at the infrastructure. What algorithm signs models — if anything signs them — what backs agent credentials, and what protects inference traffic is whatever the tooling defaulted to, unrecorded and unapproved.
      - number: 2
        name: Foundational
        description: |
          Partial visibility exists — a manually assembled list of some models and their signing status, perhaps — but it is incomplete, stale, and disconnected from algorithm governance. No deprecation rule or quantum consideration touches the AI layer.
      - number: 3
        name: Advanced
        description: |
          AI systems are first-class inventory citizens: models, agents, and inference endpoints appear in the CBOM/ML-BOM with their algorithms and keys. The approved-algorithm list covers model signing, agent credentials, and inference transport with lifecycle dates; deployers have defined the algorithms and trust anchors they accept; deprecation rules account for the longevity of provenance chains; and a documented path takes AI-layer algorithms to the NIST post-quantum standards alongside the PKI.
      - number: 4
        name: Managed
        description: |
          Discovery is automated and the inventory stays current without heroics. Algorithm additions and deprecations for the AI layer run through governed review, an algorithm substitution for model signing or agent credentials has actually been rehearsed with a validated rollback, and the post-quantum migration is tracked as a plan with dates rather than an intention.
      - number: 5
        name: Optimized
        description: |
          Visibility is continuous and complete — a cryptographic asset at the AI layer that the inventory does not know is an anomaly that pages someone. Rotating any algorithm in the AI trust chain is a routine, low-risk change, and confidential inference and long-lived provenance already ride quantum-safe algorithms or a committed migration to them. There is no path by which an AI system enters production with unapproved cryptography.
  - id: M
    categories:
    - id: key-management
      weight: 4
      guidance: |
        The AI layer adds key material at both extremes of the spectrum. At one end, agent keys: high-volume, short-lived, churning constantly — manageable only with automated issuance and rotation, and dangerous precisely when one of them quietly becomes long-lived. At the other, model-signing keys: few, slow, and catastrophic to lose — a compromised signing key forges provenance for every downstream consumer of every model, which is why they belong in hardware, under dual control, with ceremony-grade handling. Between them sit the keys protecting confidential inference. Model-signing keys are a provider concern; a deployer that only consumes third-party models holds none, but must manage the mirror image with equal discipline — the verification trust anchors, the provider signing certificates and public keys it relies on, inventoried, protected, and rotated when upstream says so.
        Key-management roles, inventories, and lifecycle procedures must name all of this explicitly, and periodic review must confirm the two disciplines that matter most: agent keys are genuinely ephemeral, and signing keys never leave hardware or single-person control.
      assessment: |
        Pull the key inventory filtered to the AI estate and check both extremes. For providers: where does the model-signing key live, who can activate it, and what does the record of the last ceremony show — then ask what the compromise procedure is and whether it has been rehearsed. For deployers: produce the trust-anchor list for procured models and the procedure for rotating an anchor when an upstream provider rotates or is compromised. For everyone: sample a handful of agent keys and check their ages against the policy lifetime. Evidence: the inventory entries, HSM attestation or key-custody records, ceremony logs, the rotation and compromise procedures, review minutes covering the AI keys. The decisive negative finding: a model-signing key in software under one person's control — or, for a deployer, no one able to say which upstream keys the organization actually trusts.
      references:
      - nist-sp-800-57
      - iso-11770
      levels:
      - number: 1
        name: Initial
        description: |
          AI-related keys are unmanaged: signing keys, where they exist, sit in software wherever the build system put them; agent keys live as long as nobody deletes them; and no inventory knows any of this.
      - number: 2
        name: Foundational
        description: |
          Some AI keys appear in inventories and someone has flagged the custody problem, but protection is uneven — perhaps the signing key reached an HSM while agent key lifetimes remain unpoliced, or trust anchors are known to exist but listed nowhere.
      - number: 3
        name: Advanced
        description: |
          The full set is governed on paper and in practice: providers hold model-signing keys in hardware under dual control with documented ceremonies; deployers maintain a protected, reviewed trust-anchor inventory with a rotation procedure; agent keys have short defined lifetimes; and the key and device inventories carry the AI entries with named owners.
      - number: 4
        name: Managed
        description: |
          The lifecycle runs at scale and under test: agent key issuance and rotation are automated across the population, ceremonies leave complete dual-control evidence, the signing-key compromise procedure and the upstream-anchor rotation have both been exercised, and periodic review verifies key ages and custody against policy with findings tracked to closure.
      - number: 5
        name: Optimized
        description: |
          Key handling is policy-driven end to end: an agent key aging past its lifetime is automatically rotated or revoked, signing-key operations are impossible outside the ceremony path, and the AI-layer key algorithms are already agile — exchangeable on a quantum-safe schedule without touching the systems that use them.
    - id: certificate-management
      weight: 5
      guidance: |
        Agent and workload identity is the flagship of this extension, and it behaves nothing like classical certificate management. Populations are large; lifetimes are short; issuance and renewal are continuous; and the credential must carry accountability — an X.509 identity binding the agent to an accountable owner or sponsor, with a workload identity such as a SPIFFE ID in the URI SAN, or an equivalent workload credential. Revocation must cascade: when a sponsor is offboarded or an agent decommissioned, every credential and delegated token flowing from that authority dies with it. The organization needs two views it can trust — an inventory of every AI-system credential it has issued, and a discovery capability that finds agents and workloads holding identities it did not know about — because the risk that defines this category is an agent acting on organizational authority that nobody can account for.
        The criteria apply to providers and deployers alike, since both run agents; providers additionally manage the identities and certificates they bind into distributed artifacts and attestations, so relying deployers can verify what they receive.
      assessment: |
        Run the trace in both directions. Forward: pick one running agent and produce its credential — who owns it, what authority it carries, when it expires, and what issued it. Backward: pick one credential from the inventory and find the workload holding it. Then apply the two stress tests: time a revocation from trigger to effect, and ask when discovery last found an agent the inventory did not know. Evidence: the credential profile document, the issued-credential inventory, discovery coverage figures against the known estate, the cascade-revocation design and its most recent test result. The decisive negative finding: agents authenticate with a shared static secret — there is no identity to manage, only a password with many holders.
      references:
      - rfc-5280
      - spiffe
      - rfc-4210
      - cab-baseline-requirements
      levels:
      - number: 1
        name: Initial
        description: |
          Nobody can say how many agents act on the organization's authority. Such credentials as exist are shared secrets or long-lived certificates issued by hand, bound to no owner, and revocable in no practical way.
      - number: 2
        name: Foundational
        description: |
          A partial picture exists — a list of known agents, some individually issued certificates — but profiles are undefined, lifetimes are long, discovery is absent, and revocation reaches individual credentials at best, never the authority chain behind them.
      - number: 3
        name: Advanced
        description: |
          Identity is designed and operating: credential profiles bind each agent to an accountable owner with a workload identity such as a SPIFFE URI SAN, lifetimes are short by policy, the issued-credential inventory is maintained, discovery actively hunts for unaccounted identities, and cascade revocation from sponsor to dependent agents and delegated tokens is defined. Providers manage the certificates bound into their distributed artifacts under the same regime.
      - number: 4
        name: Managed
        description: |
          The machinery holds at population scale: issuance and renewal are fully automated, discovery coverage is measured against the estate and stays high as the population churns, cascade revocation is periodically tested and completes within its target, and review verifies profile, lifetime, and coverage compliance.
      - number: 5
        name: Optimized
        description: |
          An unidentified agent cannot obtain access — workload authentication requires the managed identity, so the ungoverned path is closed structurally rather than by vigilance. Identity federates across trust domains where agents cross organizational lines, and revocation is fast and complete enough to be the incident response of first resort.
    - id: infrastructure-management
      weight: 3
      guidance: |
        The infrastructure that trains, stores, signs, and serves AI systems is part of the trust boundary and deserves the same documentary and defensive rigor as the PKI's own hosts. The map should show where model artifacts live, where signing happens and its keys reside, where agent runtimes execute, and where inference endpoints terminate transport — and segmentation should separate these from general workloads, because a compromise of AI-serving infrastructure can leak signing capability or slip a tampered model into the path. Vulnerability management must cover the AI-specific components — model registries, inference gateways, agent runtimes — which are young software with active CVE histories. And recovery objectives must include the AI identity and signing services, since the trust layer's availability gates everything above it.
      assessment: |
        Ask for the infrastructure documentation and check that the four elements — model storage, signing infrastructure, agent runtimes, inference endpoints — appear as identified trust components with their segmentation shown. Then verify two operational facts: the latest vulnerability scan covers the model registry and inference gateway, and a written recovery objective exists for the AI identity and signing services with evidence it has been tested. Evidence: architecture and network documentation, segmentation rules, scan coverage reports naming the AI components, recovery objectives and test records. The decisive negative finding: signing infrastructure shares a flat network with general workloads and appears in no scan scope — the highest-value AI asset has the weakest perimeter.
      references:
      - iso-27001
      - nist-csf-identify
      levels:
      - number: 1
        name: Initial
        description: |
          AI-serving infrastructure is undocumented as a trust concern: model stores, signing hosts, and inference gateways sit wherever convenience put them, unsegmented, unscanned, and absent from recovery planning.
      - number: 2
        name: Foundational
        description: |
          Partial documentation exists and the exposure is acknowledged, but segmentation has not been applied and the AI components remain outside vulnerability-management and recovery scope.
      - number: 3
        name: Advanced
        description: |
          The trust boundary is drawn and defended: AI infrastructure is documented, signing and identity services are segmented from general workloads, model registries, inference gateways, and agent runtimes are inside vulnerability-management scope, and recovery objectives cover the AI identity and signing services.
      - number: 4
        name: Managed
        description: |
          The posture is verified on a cadence: segmentation is tested rather than assumed, scan coverage of AI components is reviewed, findings are remediated within policy timelines, and the recovery objectives for AI trust services have been exercised.
      - number: 5
        name: Optimized
        description: |
          The AI trust infrastructure is resilient by construction — signing and identity services are isolated, redundant, and rapidly recoverable, and changes to the estate cannot silently move an AI component outside the documented, scanned, segmented boundary.
    - id: change-management-and-agility
      weight: 4
      guidance: |
        Every element of the AI trust chain will change: the algorithm that signs models, the algorithm behind agent credentials, inference transport, the delegation model, the provenance format. The question this category asks is whether those changes flow through managed change with rollback, or happen as ad hoc surgery. Agility requirements should be identified up front — a written statement of what the organization must be able to swap without re-architecting — because that statement is what turns cryptographic deprecation and the post-quantum transition into scheduled work, and turns incident response (rotate a compromised signing algorithm, tighten agent scope estate-wide) into an executable change rather than a crisis project.
      assessment: |
        Ask for the most recent change record that touched the AI trust chain — a signing-algorithm update, a credential-profile change, a transport upgrade — and check it moved through the change process with an approved rollback. Then ask for the agility requirements document and test its strongest claim: has an algorithm substitution actually been exercised, even in a lower environment, and what did the rollback rehearsal show? Evidence: change records, the agility requirements statement for the AI layer, substitution and rollback test results, review minutes. The decisive negative finding: the honest answer to "could you change the model-signing algorithm?" is that it would require re-architecting — agility exists as an aspiration, not a property.
      references:
      - nist-cswp-39
      levels:
      - number: 1
        name: Initial
        description: |
          Changes to AI-layer cryptography happen outside any change process — an engineer swaps a signing tool or credential setting directly in production, with no record and no way back.
      - number: 2
        name: Foundational
        description: |
          The need for control is recognized and some changes are logged, but rollback is undefined for cryptographic changes and no one has written down what the AI trust chain must be able to swap.
      - number: 3
        name: Advanced
        description: |
          Changes to the AI trust chain run through change management with approved rollback, and the agility requirements are explicit: the algorithms, credential profiles, revocation behaviors, and provenance formats that must be substitutable are named, and the systems are designed so substituting them does not mean re-architecting.
      - number: 4
        name: Managed
        description: |
          Agility has been demonstrated, not just designed: an AI-layer algorithm substitution has been executed with a validated rollback, the exercise is repeated as algorithms and estate evolve, and change-management review covers the AI trust chain on a cadence.
      - number: 5
        name: Optimized
        description: |
          Cryptographic change at the AI layer is routine: pre-approved change templates exist for the foreseeable substitutions, execution is largely automated, and the post-quantum transition of the AI trust chain is simply the current instance of a capability the organization exercises continuously.
  - id: O
    categories:
    - id: resilience
      weight: 4
      guidance: |
        Risk assessment and business impact analysis must price the AI layer's failure modes, which differ by role. The provider-side worst case is model-signing-key compromise — forged provenance for every downstream consumer of every model, a trust failure that propagates outward. The deployer-side worst case is upstream: a tampered third-party model, or a provider's trust anchor revoked after compromise — a failure the deployer must detect, contain, and replace on someone else's timeline. Both roles share the operational scenario of an agent-identity service outage, during which agents can neither authenticate nor be revoked. Incident planning and business continuity must cover these, and technology future-proofing must carry the AI layer onto a quantum-safe path — confidential inference and long-lived signed provenance are harvest-now-decrypt-later targets in their own right.
        Because AI trust spans security, ML engineering, and compliance, resilience also depends on deliberate competence sharing across those functions, and on a loop that turns AI-layer incidents and near-misses into control changes.
      assessment: |
        Pull the risk register and BIA and look for the three named scenarios — signing-key compromise, upstream provider compromise, agent-identity outage — priced with impact and owner. Then run one as a conversation: ask the incident lead to walk the response to "your model vendor announces its signing key was compromised this morning" (deployer) or "your own signing key is suspect" (provider), and check the walk matches a written plan. Evidence: risk-register extracts, BIA entries, incident plays for the AI scenarios, continuity provisions and test records for identity and signing services, the post-quantum item in the technology roadmap. The decisive negative finding: none of the AI scenarios exists anywhere in risk management — the layer's failure modes have never been imagined, let alone planned for.
      references:
      - iso-27005
      - iso-22301
      - iso-22317
      - nist-sp-800-34
      levels:
      - number: 1
        name: Initial
        description: |
          The risk register does not know the AI layer exists. No scenario covers a forged model, a compromised signing key, or an identity-service outage, and continuity planning stops at the infrastructure.
      - number: 2
        name: Foundational
        description: |
          The risks are discussed but not managed: they appear in presentations, not in the register; no impact analysis has priced them; and the incident plan would be improvised on the day.
      - number: 3
        name: Advanced
        description: |
          The AI scenarios are in the register and the BIA with owners and impacts, incident plays cover credential compromise, model tampering, and upstream provider compromise per the roles held, continuity provisions name the identity and signing services, and the technology roadmap carries the AI layer's quantum-safe transition.
      - number: 4
        name: Managed
        description: |
          Resilience is exercised: the AI scenarios are reviewed on a risk cadence, continuity for identity and signing services has been tested, cross-functional exercises put security, ML, and compliance in the same room, and incident learnings demonstrably change controls.
      - number: 5
        name: Optimized
        description: |
          The organization plans for failure modes it has not yet had: scenario planning spans the AI trust chain including multi-agent and cross-organizational dependencies, recovery of the trust services is fast enough to be unremarkable, and the harvest-now-decrypt-later exposure of inference and provenance is already closed or on a committed schedule.
    - id: automation
      weight: 4
      guidance: |
        The AI trust layer cannot be operated by hand — agent populations are too large and too short-lived, and models move too often. Three flows must be automated: the agent credential lifecycle (issuance, renewal, revocation, including the cascade), the provenance gate (providers automate signing and attestation generation in the build pipeline; everyone automates verification at deployment), and cryptographic discovery of the AI estate. Automation is also what makes two obligations practical at scale: the EU AI Act's Article 12 expectation of automatically generated, tamper-evident logs, and revocation that completes while it still matters. The automated trust processes are themselves systems to govern: monitored, audited, and equipped with defined exception handling for the day issuance backlogs or a provenance check cannot complete.
      assessment: |
        Trace one automated flow end to end — a fresh agent credential from request to issuance to its eventual expiry-driven renewal, without human touches — and then probe the edges: what happens when the provenance gate cannot verify an artifact (is there a bypass, and who can invoke it?), and who is alerted when the issuance pipeline stalls. Evidence: the automation documentation, pipeline configurations showing signing (provider) and verification gating, monitoring dashboards and alert rules for the trust automation itself, the exception-handling procedure and its invocation log. The decisive negative finding: the provenance gate can be skipped by anyone with pipeline access — automation exists, but as a suggestion.
      references:
      - nist-sp-800-92
      - slsa
      levels:
      - number: 1
        name: Initial
        description: |
          Trust operations are manual: credentials are requested by ticket, models are checked by whoever remembers, and nothing watches the gaps.
      - number: 2
        name: Foundational
        description: |
          Scripts exist where individual teams felt the pain, but coverage is partial, the provenance gate is advisory where it exists at all, and the automation runs unmonitored.
      - number: 3
        name: Advanced
        description: |
          The three flows are automated and governed: agent credential lifecycle including cascade revocation, provider-side signing and universal verification gating in the pipelines, and automatic discovery feeding the cryptographic inventory. The automation is monitored, and exception handling is defined for its failure modes.
      - number: 4
        name: Managed
        description: |
          The automation carries the full population: issuance, renewal, and revocation run at scale with measured reliability, gate exceptions are rare, logged, and reviewed, and audits examine the trust automation as a control in its own right.
      - number: 5
        name: Optimized
        description: |
          The automated path is the only path: credentials cannot be minted and models cannot deploy outside it, the pipelines heal routine failures without intervention, and the exception process is used so rarely that each invocation is itself a reviewed event.
    - id: interoperability
      weight: 3
      guidance: |
        AI trust crosses boundaries early: agents from different teams and organizations interact, workloads federate identity, and AI-generated content moves between systems that must verify where it came from. Open standards are what make this composable — SPIFFE for workload identity, RFC 8693 token exchange for scoped delegation, C2PA for content provenance, SLSA and in-toto for model supply-chain attestations. Providers emit attestations and provenance in these open formats so any relying party can verify them; deployers implement verification of the same formats and require them from vendors. A proprietary agent-identity or provenance mechanism is a dead end here: it locks the organization in and locks partners out, and provenance that only the issuing system can verify is barely provenance at all.
      assessment: |
        Ask which standards the organization has adopted for AI trust and where that decision is documented, then test it with an artifact: for a provider, take the most recent model release and inspect the attestation that shipped with it — is it a format an outside party could verify? For a deployer, take a recently procured model and show the verification of its upstream attestation actually running. Evidence: the interoperability strategy naming the adopted standards, integration guidance for consuming identities and verifying provenance, a sample attestation and a sample verification, records of any cross-domain trust exercised with a partner. The decisive negative finding: provenance and identity work only inside the organization's own tooling — nothing it produces can be verified, and nothing it receives is.
      references:
      - open-standards-principles
      - spiffe
      - c2pa
      - in-toto
      levels:
      - number: 1
        name: Initial
        description: |
          Whatever identity or provenance exists is homegrown and internal: no standard formats, no strategy, and no way for any outside party to verify anything the organization's AI systems produce or claim.
      - number: 2
        name: Foundational
        description: |
          Standards are known and informally piloted — an experiment with SPIFFE here, a signed attestation there — but no adopted position binds the organization, and integration guidance is absent.
      - number: 3
        name: Advanced
        description: |
          The strategy names the standards and they are in use: workload identity on SPIFFE or equivalent, delegation via RFC 8693 token exchange, provenance in C2PA and model attestations in SLSA or in-toto formats. Providers emit them with releases; deployers verify them and require them contractually; integration guidance exists for both directions.
      - number: 4
        name: Managed
        description: |
          Interoperability is proven in the field: cross-domain trust has been exercised with at least one external party, standards conformance is checked in real integrations rather than assumed, and the adopted set is reviewed as the standards evolve.
      - number: 5
        name: Optimized
        description: |
          Federation is unremarkable: agents and workloads carry identities that other trust domains accept, provenance verifies anywhere in the ecosystem, and the organization contributes implementation experience back into the standards it depends on.
    - id: monitoring-and-auditing
      weight: 5
      guidance: |
        This category carries the EU AI Act's sharpest cryptographic obligation into the model. Article 12 requires high-risk AI systems to generate tamper-evident logs that make their operation traceable — and the agent action layer, the tool and API calls, is in scope. Cryptographically, that means the logging requirements must name the events that establish accountability: which agent acted, under whose delegated authority, against which model version, with which credential, calling what. From those events the audit trail must be able to reconstruct, verifiably, what an AI system did and on whose authority — and the logs themselves must resist tampering, which places log integrity protection squarely in this category. Record-keeping duties fall on both roles: providers keep the automatically generated logs of the systems they place on the market (Article 19); deployers retain the logs under their control for at least six months (Article 26(6)).
        On top of the record sits detection: monitoring for agent credential anomalies and misuse across the population, with critical events — credential compromise, an unsigned or tampered model surfacing — alerted and handled under the incident plan rather than discovered in retrospect.
      assessment: |
        Run the reconstruction test: pick one action an AI system took yesterday — a consequential API call, a content generation, a decision — and rebuild from logs alone the full chain: the agent, the credential it presented, the authority it acted under, the model version involved, and the downstream calls it made. Then ask for the demonstration that those logs are tamper-evident, and check the retention configuration against the role's duty. Finally, test detection with history: when did monitoring last flag an anomalous agent, and what happened next? Evidence: the logging requirements naming the cryptographic events, the log-integrity mechanism, the retention configuration, the reconstruction itself, alert rules and a handled-incident record. The decisive negative finding: the reconstruction cannot attribute the action to a specific agent and authority — the organization operates AI it cannot account for.
      references:
      - eu-ai-act
      - nist-sp-800-92
      - nist-sp-800-61
      levels:
      - number: 1
        name: Initial
        description: |
          AI-system actions leave no usable trace: logs are absent, unattributed, or freely editable, and no one could say after the fact which agent did what on whose authority.
      - number: 2
        name: Foundational
        description: |
          Logging exists but with gaps that defeat accountability: some systems log and some do not, action-layer calls are missed, integrity protection is absent, and attribution works only when someone remembers the context.
      - number: 3
        name: Advanced
        description: |
          The record stands up: logging requirements name the cryptographic events — agent, credential, delegated authority, model version, action-layer calls — collection is tamper-evident consistent with Article 12, retention matches the role's duty, and the audit trail can reconstruct an AI system's actions and authority. Monitoring watches for credential anomalies and alerts on the critical events.
      - number: 4
        name: Managed
        description: |
          The record is exercised and the detection is tuned: reconstructions are performed routinely rather than heroically, log integrity is verified on a schedule, anomaly detection produces findings that get handled under the incident plan, and periodic log review closes the loop.
      - number: 5
        name: Optimized
        description: |
          Reconstruction is a query, not an investigation — any action by any agent resolves to its full authority chain in minutes, log integrity is continuously verified, and anomaly detection watches the whole population and action layer proactively. The audit trail is strong enough to serve as the organization's evidence of AI accountability to auditors, regulators, and relying parties.
  - id: R
    categories:
    - id: sourcing
      weight: 3
      guidance: |
        The AI trust layer fails quietly at procurement. For deployers, vendor capability assessment is the central sourcing control: a procured AI platform or model must demonstrably support signing and attestations, workload identity, and the Article 12 logging the organization is obliged to keep — tested before contract, not discovered after. Providers face the mirror image plus their own stack: they source the signing infrastructure itself — HSMs, signing services, registries that preserve attestations — and their platform choices determine what trust properties they can offer downstream. Resource identification must also cover people: the AI trust layer needs staff who span PKI and ML operations, and that profile does not hire itself. Availability of the identity and signing capability should be treated as a managed dependency, and the resource picture reviewed as the AI estate grows.
      assessment: |
        Take the most recently procured AI platform or model and pull its vendor assessment: were signing support, attestation formats, workload-identity capability, and log generation actually tested — with results — or asserted by the vendor and accepted? Then check the people side: who operates the AI trust layer today, is that a named role or a side task, and what does the resourcing plan say about the estate a year out. Evidence: the vendor assessment with test results, contract clauses carrying the trust requirements, the resource and role documentation, review records tracking gaps. The decisive negative finding: the flagship AI platform was procured with none of the trust capabilities checked — the organization is now trying to govern on top of tooling that cannot support it.
      references:
      - iso-27001
      - nist-ai-rmf
      levels:
      - number: 1
        name: Initial
        description: |
          AI platforms and models are procured on functionality and price alone; nobody asks whether they can sign, attest, carry identities, or log. No resource is named for AI trust.
      - number: 2
        name: Foundational
        description: |
          The questions are asked informally — a security reviewer raises signing support in some procurements — but no defined assessment exists, results do not bind the decision, and AI trust work is absorbed by whoever has slack.
      - number: 3
        name: Advanced
        description: |
          Sourcing carries the trust requirements: vendor assessments test signing, attestation, workload identity, and logging capability with recorded results, contracts encode the obligations, the people and tooling the AI trust layer needs are identified and filled, and availability of the identity and signing capability is managed as a dependency.
      - number: 4
        name: Managed
        description: |
          The controls are verified in the field: vendor capabilities are re-checked in operation rather than trusted from the assessment, resource reviews track the growing estate against staffing and tooling, and identified gaps close on a plan.
      - number: 5
        name: Optimized
        description: |
          Sourcing shapes the market the organization buys from: trust capabilities are non-negotiable selection criteria vendors know in advance, provider roadmaps are steered toward the identity, provenance, and logging support required, and resourcing anticipates new AI trust patterns before they arrive in production.
    - id: knowledge-and-training
      weight: 3
      guidance: |
        AI system cryptographic governance sits at the junction of three disciplines that rarely share a desk: PKI and cryptography, machine learning and model operations, and AI regulation. Most failures of the AI trust layer trace back to that junction — a competent PKI team that does not know how model pipelines work, ML engineers who have never handled a signing key, compliance staff who cannot connect Article 12 to a log format. The training plan should build the crossings deliberately: role-appropriate training for the people who operate the layer — agent identity operators, model-signing authorities, ML engineers deploying signed models — plus AI-trust content in general security awareness, and a refresh cadence that keeps pace with a fast-moving field of standards and regulation.
      assessment: |
        Find the people at the junction and test the crossings: ask the person who last ran a signing ceremony what training qualified them; ask an ML engineer who deploys models what the provenance gate checks and why; ask the compliance owner which log fields satisfy Article 12. Then look at the plan behind the answers. Evidence: the training plan naming the AI trust roles and content, completion records for the responsible personnel, the awareness material covering AI trust, the review record showing content updated as standards and regulation moved. The decisive negative finding: the AI trust layer is operated entirely by single-discipline staff with no plan to build the second discipline — the junction is unstaffed.
      references:
      - nist-sp-800-16
      - nist-sp-800-50
      - ecsf
      levels:
      - number: 1
        name: Initial
        description: |
          No training touches AI trust: the people running signing, identity, or verification learned by doing, awareness content ignores the topic, and nothing is planned.
      - number: 2
        name: Foundational
        description: |
          Learning happens ad hoc — a conference talk here, a vendor workshop there — and the cross-disciplinary need is acknowledged, but no plan names the roles or the content, and coverage depends on individual initiative.
      - number: 3
        name: Advanced
        description: |
          The plan exists and runs: AI identity operators, signing authorities, and deploying engineers receive role-appropriate training covering the cryptography, the ML pipeline realities, and the regulatory duties; security awareness includes the AI trust essentials; and the material is reviewed as the field moves.
      - number: 4
        name: Managed
        description: |
          Effectiveness is measured, not assumed: completion and competence are tracked for the critical roles, gaps found in incidents or audits feed back into the curriculum, and cross-disciplinary depth is deliberately built through rotation, pairing, or shared exercises.
      - number: 5
        name: Optimized
        description: |
          The junction has become a strength: the organization grows people fluent across PKI, ML operations, and AI regulation, keeps them current as a matter of routine, and its practitioners teach outward — internally to new teams and externally to the community it recruits from.
    - id: awareness
      weight: 3
      guidance: |
        The specialists cannot hold the line alone. The developers and product teams who build with AI decide daily whether the trust controls are a paved road or an obstacle — and organizations get the behavior their awareness has earned. The awareness plan should give every builder the short version of the posture: models must be signed and their provenance verified before production, agents must hold managed identities bound to an owner, and AI-system actions are logged and attributable. Around that core: a clear single point of contact for AI-trust and AI-identity questions, timely communication when the posture or its requirements change, and — where relying parties exist — the ability to disclose the organization's AI trust posture outward, because verifiable trust that nobody can learn about earns nothing.
      assessment: |
        Step outside the security function and ask a development team that ships AI features three questions: what must be true of a model before it reaches production, what identity do your agents run under, and whom do you ask when trust requirements are unclear. Confident, roughly correct answers are the category working; blank looks are the finding. Then check the machinery: the awareness plan, the named point of contact and evidence it is actually used, the record of the last posture-change communication, and any outward disclosure of the AI trust posture. The decisive negative finding: teams knowingly route around the trust controls because they consider them someone else's concern — awareness has failed into active circumvention.
      references:
      - enisa-cyber-awareness
      - nist-sp-800-50
      levels:
      - number: 1
        name: Initial
        description: |
          Outside the specialists, nobody knows the posture exists. Builders ship unsigned models and anonymous agents in good faith, because no one ever told them otherwise.
      - number: 2
        name: Foundational
        description: |
          Awareness is patchy and personal: teams near the security function know the expectations, distant teams do not, and there is no plan, no point of contact, and no communication channel making it uniform.
      - number: 3
        name: Advanced
        description: |
          The plan runs: builders and stakeholders receive the AI-trust essentials, a named point of contact fields questions, posture changes are communicated when they happen, and where relying parties exist, the organization can state its AI trust posture outward.
      - number: 4
        name: Managed
        description: |
          Awareness is measured and maintained: understanding is checked across teams rather than assumed, communications are timely and confirmed to land, and the awareness activity itself is reviewed and improved on findings.
      - number: 5
        name: Optimized
        description: |
          The culture does the work: signing, identity, and verification are simply how AI ships here, new joiners absorb the posture as the default paved road, and the organization communicates its AI trust posture proactively — internally as expectation, externally as evidence.
overlays:
  modules:
  - id: G
    categories:
    - id: strategy-and-vision
      requirements:
      - id: scope-and-drivers
        type: multiplier
        multiplier: 2.0
        rationale: |
          AI systems as cryptographic actors, and the EU AI Act / DORA obligations that attach to them, are new business drivers absent from classical PKI scope. The AI layer must be explicitly in scope for the driver analysis, not assumed to be covered by PKI scope.
      - id: architecture
        type: override
        override: 3
        rationale: |
          The base model weights architecture at the floor for general PKI programs. For AI-layer governance it is among the most consequential decision sets — agent identity model, model-signing topology, provenance chain, delegation and cascade-revocation design — and a multiplier on a floor weight cannot express that shift. The requirement is re-rated outright.
    - id: policies-and-documentation
      requirements:
      - id: certificate-policy
        type: multiplier
        multiplier: 1.5
        rationale: |
          The certificate/trust policy must be extended to cover agent credential profiles, owner/sponsor binding, delegation, and model-signing — new content the classical CP does not contain. Weight is already high, but the AI layer changes what the policy must define.
      - id: policy-review
        type: multiplier
        multiplier: 1.5
        rationale: |
          AI trust standards and regulation move quickly; policy review must cover the AI layer with a cadence that keeps agent profiles, provenance formats, and algorithm choices current.
    - id: compliance
      type: addition
      addition: 2
      rationale: |
        The base model weights this category low for general PKI programs, where compliance is one governance concern among several. The EU AI Act and DORA attach binding, role-specific obligations with a cryptographic core directly to this category, so for organizations operating AI systems its overall weight rises absolutely, independently of the emphasis on individual requirements.
      requirements:
      - id: compliance-policies
        type: multiplier
        multiplier: 2.0
        rationale: |
          The EU AI Act (Articles 12 and 15) and DORA-for-AI introduce a new compliance domain with cryptographic obligations distinct from PKI compliance. These are new obligations, not expanded existing ones.
      - id: compliance-monitoring
        type: multiplier
        multiplier: 1.5
        rationale: |
          Monitoring scope expands to AI-layer conformance (Article 12 log integrity, provenance, agent identity coverage), but the core activity remains operating a compliance monitoring program.
    - id: processes-and-procedures
      requirements:
      - id: process-documentation
        type: multiplier
        multiplier: 2.0
        rationale: |
          Agent onboarding/offboarding with cascade revocation, model-signing ceremonies, and provenance-verification gating are fundamentally new processes with no classical-PKI equivalent, not merely expanded documentation.
      - id: process-evidence
        type: multiplier
        multiplier: 1.5
        rationale: |
          New evidence categories arise for the AI layer: signing-ceremony records, cascade-revocation test results, provenance-verification logs. The evidence discipline is broader than for classical PKI operations.
    - id: cryptography
      requirements:
      - id: crypto-visibility
        type: multiplier
        multiplier: 2.0
        rationale: |
          The core gap the extension addresses. AI systems (models, agents, inference endpoints) must appear in the cryptographic inventory; without visibility into AI-layer cryptography, the AI systems remain ungoverned even with a mature PKI.
      - id: crypto-agility
        type: multiplier
        multiplier: 2.0
        rationale: |
          Crypto-agility must reach the AI trust chain (model-signing algorithm, agent credential algorithm, inference transport). This is the capability that lets the AI layer track deprecation and the PQC transition without re-architecting.
      - id: crypto-algorithms
        type: multiplier
        multiplier: 1.5
        rationale: |
          Approved-algorithm governance must extend to AI-specific uses (model signing, agent credentials, inference transport). Weight is already high, but coverage of AI uses is a substantive expansion.
      - id: crypto-lifecycle
        type: multiplier
        multiplier: 1.5
        rationale: |
          Lifecycle and deprecation rules must apply to cryptography embedded in model-provenance chains and long-lived signed artifacts, which have different longevity considerations from classical certificates.
  - id: M
    categories:
    - id: key-management
      requirements:
      - id: key-lifecycle
        type: multiplier
        multiplier: 1.5
        rationale: |
          Ephemeral, high-volume agent keys and high-value model-signing keys impose lifecycle demands (very short lifetimes on one end, strong dual-control hardware protection on the other) beyond classical key lifecycle.
      - id: key-inventory
        type: multiplier
        multiplier: 1.5
        rationale: |
          The key inventory must include AI-system keys (agent, model-signing, inference) and their backing stores, which are commonly omitted from classical key inventories.
    - id: certificate-management
      requirements:
      - id: cert-lifecycle
        type: multiplier
        multiplier: 2.0
        rationale: |
          Agent credential lifecycle is high-volume, short-lived, continuously issued and renewed, and must support cascade revocation — a materially different and more demanding lifecycle than classical certificate management.
      - id: cert-inventory
        type: multiplier
        multiplier: 1.5
        rationale: |
          An inventory of issued AI-system credentials is essential so that no agent acts on organizational authority unaccounted for; this extends the classical issued-certificate inventory to a fast-changing agent population.
      - id: cert-discovery
        type: multiplier
        multiplier: 1.5
        rationale: |
          Discovery must find agents and workloads holding identities across a dynamic estate; unknown agents holding credentials is a distinct AI-layer risk.
      - id: cert-profiles
        type: multiplier
        multiplier: 1.5
        rationale: |
          New credential profiles are required for AI systems (owner/sponsor binding, workload identity such as SPIFFE URI SAN), beyond classical certificate profiles.
    - id: infrastructure-management
      requirements:
      - id: vulnerability-management
        type: multiplier
        multiplier: 1.5
        rationale: |
          Vulnerability management must extend to AI-serving components (model registries, inference gateways, agent runtimes), whose compromise can expose signing keys or admit tampered models.
    - id: change-management-and-agility
      requirements:
      - id: agility-requirements
        type: multiplier
        multiplier: 2.0
        rationale: |
          Agility requirements must be identified explicitly for the AI trust chain (algorithms, credential profiles, revocation behavior, provenance formats) so AI-layer cryptographic change does not require re-architecting.
  - id: O
    categories:
    - id: resilience
      requirements:
      - id: risk-assessment
        type: multiplier
        multiplier: 1.5
        rationale: |
          Risk assessment and BIA must incorporate AI-system cryptographic scenarios (model-signing key compromise, agent identity outage, tampered model in production), which are new impact pathways.
      - id: future-proofing
        type: multiplier
        multiplier: 1.5
        rationale: |
          Technology future-proofing must carry the AI layer onto a quantum-safe path; confidential inference and long-lived signed provenance are exposed to harvest-now-decrypt-later, in step with the PKI.
    - id: automation
      type: addition
      addition: 1
      rationale: |
        At agent-population scale, automation is a precondition for governance rather than an operational optimization — cascade revocation and Article 12 logging are only practical when automated. The category's overall weight rises absolutely in this context.
      requirements:
      - id: automation-description
        type: multiplier
        multiplier: 2.0
        rationale: |
          Large, short-lived agent populations make automation of credential issuance, renewal, revocation, and provenance gating a necessity rather than an option; the automated AI-trust flows must be described and governed.
      - id: exception-handling
        type: addition
        addition: 1
        rationale: |
          When the provenance gate cannot verify an artifact or credential issuance stalls, the exception path is where the ungoverned path would reopen. The base floor weight cannot carry that risk; the absolute increase reflects that exception handling in trust automation is a control in its own right.
    - id: interoperability
      requirements:
      - id: open-standards
        type: multiplier
        multiplier: 2.0
        rationale: |
          Cross-domain AI trust depends on open standards (SPIFFE, RFC 8693, C2PA, SLSA/in-toto). Proprietary AI-identity or provenance mechanisms block federation and verifiable provenance across the ecosystem.
    - id: monitoring-and-auditing
      type: addition
      addition: 2
      rationale: |
        Article 12 places tamper-evident traceability at the center of AI-layer accountability, and the record-keeping duties bind both roles — providers under Article 19 and deployers under Article 26(6). A category the base model weights low becomes primary in this context.
      requirements:
      - id: audit-trail
        type: multiplier
        multiplier: 2.0
        rationale: |
          EU AI Act Article 12 requires a reconstructable, tamper-evident record of what a high-risk AI system did; the audit trail must attribute actions to a specific agent and delegated authority across the action layer — a new and central AI-layer requirement.
      - id: logging-requirements
        type: multiplier
        multiplier: 1.5
        rationale: |
          Logging requirements must define AI-system cryptographic events (agent identity, delegated authority, model version, credential, action-layer authorization) and tamper-evidence, expanding classical logging scope.
      - id: event-monitoring
        type: multiplier
        multiplier: 1.5
        rationale: |
          Monitoring must detect AI credential anomalies and misuse across the agent population and action layer, a new detection surface beyond classical operational and security events.
  - id: R
    categories:
    - id: sourcing
      requirements:
      - id: resource-identification
        type: multiplier
        multiplier: 1.5
        rationale: |
          Resource identification must capture AI-trust needs (signing-capable model registries, workload-identity-capable agent platforms, HSMs for signing keys) and vendor capability, which classical sourcing does not consider.
    - id: knowledge-and-training
      requirements:
      - id: personnel-training
        type: multiplier
        multiplier: 1.5
        rationale: |
          Operating the AI trust layer requires cross-disciplinary competence (PKI, ML/model operations, AI regulation); role-appropriate training for AI identity operators and model-signing authorities is a new requirement.
    - id: awareness
      requirements:
      - id: awareness-plan
        type: multiplier
        multiplier: 1.5
        rationale: |
          Developers and stakeholders must understand that models require signing and provenance verification and that agents require managed identities; the awareness plan must carry these AI-trust requirements to close the policy-to-behavior gap.
