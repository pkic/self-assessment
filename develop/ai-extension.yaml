schemaVersion: 1.0.0
extension:
  id: ai-crypto-governance
  name: AI System Cryptographic Governance Extension
  version: 0.1.0
  description: Extends the assessment model with cryptographic governance criteria for the AI system layer — the identity, integrity, provenance, and trust controls for AI models and autonomous agents that sit above the PKI infrastructure the base model governs. Adds AI-specific maturity guidance and requirement weight overlays so organizations subject to the EU AI Act and DORA can assess whether their AI systems are cryptographically governed, not only their underlying PKI. Criteria are persona-aware — provider (develops or distributes AI systems) and deployer (operates AI systems under its authority, including procured third-party models) receive role-specific criteria where their obligations diverge, stated in-line within the criteria text; statements not qualified by role apply to both.
  documentation: https://pkic.org/wg/pkimm/model/extensions/catalog/ai-crypto-governance/
  compatibility:
  - 2.0.0
  floorScore: true
