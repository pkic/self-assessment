name: Release to GitHub Pages

# A tag publishes the tool under release/, with one page per bundled model
# release at release/{assessment}/{version}/. Folders published by earlier
# tags at /<tag>/ are left as they are.
on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish_pages.yml
    with:
      target: release
      label: Release ${{ github.ref_name }}
