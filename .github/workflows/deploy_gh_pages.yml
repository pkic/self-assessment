name: Deploy branch preview to GitHub Pages

# main is published on every push; any other branch on request. The old
# /develop/ path keeps working as a redirect to the main-branch preview.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/')
    permissions:
      contents: write
    uses: ./.github/workflows/publish_pages.yml
    with:
      branch: ${{ github.ref_name }}
      label: Branch ${{ github.ref_name }}
      alias: ${{ github.ref_name == 'main' && 'develop' || '' }}
