name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destination_dir:
        description: GitHub Pages directory for this build
        required: true
        default: develop

permissions:
  contents: write

jobs:
  gh-deploy:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version-file: ".node-version"
      - name: Build component
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          npm install
          npm run build
      - name: Copy index and data files
        run: |
          cp ./src/public/index.html ./dist/index.html
          cp ./src/public/pkimm-model-1.0.0.yaml ./dist/pkimm-model-1.0.0.yaml
          cp ./src/public/pkimm-model-2.0.0.yaml ./dist/pkimm-model-2.0.0.yaml
          cp ./src/public/pkimm-references.yaml ./dist/pkimm-references.yaml
          cp ./src/public/pqcmm-model-1.0.1.yaml ./dist/pqcmm-model-1.0.1.yaml
          cp ./src/public/pqcmm-model.schema-1.0.0.json ./dist/pqcmm-model.schema-1.0.0.json
          cp ./src/public/assessment-profile.schema-1.0.0.json ./dist/assessment-profile.schema-1.0.0.json
          cp ./src/public/assessment-package.schema-1.0.0.json ./dist/assessment-package.schema-1.0.0.json
      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 #v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./dist
          destination_dir: ${{ inputs.destination_dir || 'develop' }}
